# Replaces the image's /etc/clamav/clamd.conf. Limits sized for gateway workloads:
# attachments larger than the limits are reported (AlertExceedsMax) rather than passed silently.
LogFile /var/log/clamav/clamd.log
LogTime yes
User clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 12
MaxQueue 100
StreamMaxLength 50M
MaxScanSize 200M
MaxFileSize 50M
MaxRecursion 16
MaxFiles 10000
AlertOLE2Macros yes
AlertExceedsMax yes
HeuristicScanPrecedence yes
# Local stack only: reload signatures in place instead of loading a second engine alongside the
# first. A concurrent reload briefly holds two copies (~2.5 GB), which gets clamd OOM-killed on
# the 8 GB Docker VM. Scans wait for the reload (seconds) instead. Production sizes the clamd
# pods for concurrent reload (Phase 4.2).
ConcurrentDatabaseReload no
