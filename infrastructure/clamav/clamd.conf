# Replaces the image's /etc/clamav/clamd.conf (step 4.2 A7, docs/plan/steps/10-attachment-scanning.md).
# Memory-conservative for the 8 GB local Docker VM (never two clamd instances; Compose caps the
# container at mem_limit). The email-worker talks to clamd over TCP INSTREAM only
# (@email-gateway/clamav); attachments above the limits are reported (AlertExceedsMax,
# Heuristics.Limits.Exceeded.*) rather than passed silently. Changing this file needs a clamav
# container restart (docker compose restart clamav), not a rebuild.
LogFile /var/log/clamav/clamd.log
LogTime yes
User clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# Scanning threads and queued connections. The worker's CLAMAV_MAX_CONNECTIONS x replicas should
# stay <= MaxThreads + MaxQueue; production scales clamd replicas instead.
MaxThreads 4
MaxQueue 32
# Largest INSTREAM accepted: above ATTACHMENT_MAX_BYTES (25 MiB), so a size-limit reply signals a
# misconfiguration (ClamdSizeLimitError, limit.clamav), never a normal attachment.
StreamMaxLength 30M
# Limits of clamd's own unpacking of archives and documents (zip, 7z, rar, cab, bzip2, xz, OLE…).
MaxScanSize 150M
MaxFileSize 30M
MaxRecursion 10
MaxFiles 2000
AlertExceedsMax yes
AlertOLE2Macros yes
# The attachment inspector reports encrypted archives itself (archive.encrypted); with yes every
# encrypted zip would also become a Heuristics.Encrypted.* hit.
AlertEncrypted no
# no: a heuristic hit (e.g. macros) must not stop the scan before a real signature can match,
# which would turn malware into "suspicious".
HeuristicScanPrecedence no
# Local stack only: reload signatures in place instead of loading a second engine alongside the
# first. A concurrent reload briefly holds two copies of the database, which gets clamd
# OOM-killed on the 8 GB Docker VM; scans wait for the reload (seconds) instead. Production sizes
# the clamd pods for ConcurrentDatabaseReload yes (docs/deployment/attachment-scanning.md).
ConcurrentDatabaseReload no
