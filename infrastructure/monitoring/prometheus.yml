global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (step 3.2 Q15: messaging.rules.yml; step 3.3 L14: lifecycle.rules.yml; step 4.1 S17:
# scanning.rules.yml; step 4.3 U18: click-service.rules.yml, url-scanning.rules.yml; step 4.6 X20:
# sandbox-controller.rules.yml; step 5.2 P24: policy-engine.rules.yml; step 6.1 D16:
# api.rules.yml). Alertmanager routing is
# step 10.3; until then the alerts are visible on the Prometheus /alerts page.
rule_files:
  - rules/*.rules.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
  # Per-queue series of the topology vhost (step 3.2 Q15): rabbitmq_detailed_queue_messages,
  # _messages_ready, _messages_unacked, _consumers (labels vhost, queue). Names verified against
  # the running RabbitMQ 4.1 broker (docs/runbooks/rabbitmq-messaging.md).
  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      vhost: [email-gateway]
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ['rabbitmq:15692']
  # api (step 6.1 D16; quarantine series of step 5.3 Q29): api_http_*, api_rate_limit*,
  # api_idempotency_total, api_cursor_rejected_total, api_list_scan_budget_exhausted_total,
  # api_report_*, quarantine_* and the shared process series. /metrics is on the api port but
  # outside /api (internal only; never routed by an Ingress, ADR-0053).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
  # smtp-adapter (step 2.2 D16): policy, socketmap, SASL, ingestion, bounce and reputation
  # metrics. Metric names are a contract for the dashboards of step 10.3.
  - job_name: smtp-adapter
    metrics_path: /metrics
    static_configs:
      - targets: ['smtp-adapter:3010']
  # email-worker (steps 3.1, 3.2, 4.1): MIME ingestion, the security scan stage (scan_*, S17) and
  # their queue consumers (amqp_consumer_*).
  - job_name: email-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['email-worker:3020']
  # delivery-worker (step 2.3 R14): approvals, reinjections, status signals and transitions, log
  # and outbox lag, rate limiting, reconciler actions; step 3.2 queue consumer (amqp_consumer_*).
  - job_name: delivery-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['delivery-worker:3040']
  # policy-engine (step 5.2 P24): policy_* evaluation series, the shared lifecycle_* and amqp_*.
  - job_name: policy-engine
    metrics_path: /metrics
    static_configs:
      - targets: ['policy-engine:3030']
  # notification-worker (step 5.2 P24): notification_policy_messages_total, send duration, amqp_*.
  - job_name: notification-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-worker:3050']
  # webhook-worker (step 6.2 W1–W13): webhook_* fanout, delivery, replay, maintenance and alert
  # request series, the shared amqp_* consumer series (fanout role). Compose runs both roles in
  # one container; Kubernetes scrapes the webhook-fanout and webhook-delivery Services.
  - job_name: webhook-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['webhook-worker:3075']
  # event-relay (step 3.2 §5.3): outbox relay (outbox_relay_*), outbox health (outbox_*),
  # reconciliation (reconcile_*), AMQP client (amqp_*).
  - job_name: event-relay
    metrics_path: /metrics
    static_configs:
      - targets: ['event-relay:3070']
  # Inbound Rspamd (step 4.1 S17): the controller's OpenMetrics endpoint (rspamd_* scan, action,
  # learn and memory series). The controller answers only with its read password outside its
  # loopback secure_ip, so the header is read from a mounted secret file (Compose secret
  # `rspamd_controller_password`, never written into this file).
  - job_name: rspamd
    metrics_path: /metrics
    http_headers:
      Password:
        files: [/run/secrets/rspamd_controller_password]
    static_configs:
      - targets: ['rspamd:11334']
  # click-service (step 4.3 U18): its ADMIN listener only (3081; the public 3080 has no /metrics).
  # click_* series plus url_* with component="click".
  - job_name: click-service
    metrics_path: /metrics
    static_configs:
      - targets: ['click-service:3081']
  # Isolated browser worker and egress proxy (step 4.3 U15, U18; profile url-browser). The
  # worker sits on the internal url-sandbox network only: this job answers only where Prometheus
  # can reach that network (Kubernetes: the NetworkPolicy admits Prometheus on 3090). Locally
  # `up{job="url-browser-worker"}` is 0 unless Prometheus is attached to url-sandbox.
  - job_name: url-browser-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['url-browser-worker:3090']
  - job_name: url-egress-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ['url-egress-proxy:3091']
  # sandbox-controller (step 4.6 X20; profile sandbox): sandbox_* series (tasks, backend
  # readiness and identity, reaper, cleanup failures, limits, findings, artifacts, S3 and publish
  # errors) plus amqp_*. The controller sits on the internal sandbox-control network only: this
  # job answers only where Prometheus can reach that network (Kubernetes: the NetworkPolicy admits
  # Prometheus on 3092). Locally `up{job="sandbox-controller"}` is 0 unless Prometheus is attached
  # to sandbox-control. The `environment` TARGET label (local here; production/staging in the
  # cluster's scrape config) drives SandboxExecutingBackendOutsideTest — external labels are not
  # visible to rule evaluation, and a series without the label counts as "not a test
  # environment" (fail-safe).
  - job_name: sandbox-controller
    metrics_path: /metrics
    static_configs:
      - targets: ['sandbox-controller:3092']
        labels: { environment: local }
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
