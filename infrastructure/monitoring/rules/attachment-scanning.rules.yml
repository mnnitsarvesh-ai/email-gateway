# Attachment scanning alerts (step 4.2 A19, docs/plan/steps/10-attachment-scanning.md). Series:
# the email-worker's attachment engine (scan_attachment_*, clamav_*, labels verdict/cache/stage/
# source/severity/code/result/reason/state/component, bounded enums only), the 4.1 generic scan
# series with engine="attachment", and the topology vhost's queue series of job
# `rabbitmq-detailed`. Every alert links its section of docs/runbooks/attachment-scanning.md.
# Validate with `promtool check rules` and
# `promtool test rules tests/attachment-scanning.rules.test.yml`.
groups:
  - name: attachment-scanning
    rules:
      - alert: ClamavUnavailable
        # The attachment engine's breaker (2 = open): clamd or the inspector keeps failing.
        expr: max(scan_engine_circuit_state{engine="attachment"}) == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Attachment engine circuit open (clamd unavailable)
          description: >-
            The attachment engine's circuit breaker has been open for 2 minutes on at least one
            email-worker: clamd is down, overloaded or reloading, or the inspector keeps failing.
            Attachment scans are retried with backoff and end scan_failed after
            SCAN_ATTACHMENT_MAX_ATTEMPTS or the round deadline (never clean).
          runbook_url: docs/runbooks/attachment-scanning.md#clamavunavailable
      - alert: ClamavSignaturesStale
        expr: max(scan_attachment_clamav_db_age_seconds) > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: ClamAV signature database older than 48 hours
          description: >-
            The ClamAV daily database reported by clamd VERSION has been older than 48 hours for
            30 minutes: freshclam is not updating (network, mirror rate limit, disk). New malware
            is not detected by signatures until it updates.
          runbook_url: docs/runbooks/attachment-scanning.md#clamavsignaturesstale
      - alert: AttachmentScanFailuresHigh
        # Final results only: an attempt that was retried successfully is not counted.
        expr: >-
          sum(rate(scan_engine_results_total{engine="attachment",final="true",outcome=~"timeout|error"}[10m]))
          / sum(rate(scan_engine_results_total{engine="attachment",final="true"}[10m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Attachment engine final failures above 5 %
          description: >-
            More than 5 % of the final attachment results of the last 10 minutes are timeout or
            error (clamd, inspector, part objects). Their rounds end scan_failed; rescan them
            after the cause is fixed.
          runbook_url: docs/runbooks/attachment-scanning.md#attachmentscanfailureshigh
      - alert: AttachmentInspectorKills
        expr: sum(rate(scan_attachment_inspector_kills_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Attachment inspector children killed frequently
          description: >-
            Inspector children have been killed more than 0.1 times per second for 10 minutes
            (CPU, memory, wall clock or crash). Check the reason label: CPU/memory kills are
            hostile or oversized files (limit.cpu_time / limit.memory), wall-clock kills mean an
            overloaded host, crashes a binding or limit bug.
          runbook_url: docs/runbooks/attachment-scanning.md#attachmentinspectorkills
      - alert: AttachmentScanQueueBacklog
        expr: >-
          (max(rabbitmq_detailed_queue_messages_ready{vhost="email-gateway",queue="scan.attachment"}) > 1000)
          or
          (histogram_quantile(0.95, sum by (le) (rate(scan_event_lag_seconds_bucket{engine="attachment"}[10m]))) > 180)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Attachment scan queue backlog
          description: >-
            scan.attachment has had more than 1000 ready messages, or the p95 age of attachment
            scan triggers at handling start has been above 180 s, for 10 minutes. Scale
            email-worker-attachment (and clamd) or check clamd latency.
          runbook_url: docs/runbooks/attachment-scanning.md#attachmentscanqueuebacklog
      - alert: AttachmentScanLatencyHigh
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(scan_attachment_stage_duration_seconds_bucket{stage="total"}[15m]))) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Attachment scan p95 latency above 30 s
          description: >-
            The p95 time to scan one attachment (S3 read, clamd, inspector) has been above 30 s
            for 15 minutes. Check the stage histogram (clamav vs inspect vs s3_read), clamd
            threads and the inspector pool.
          runbook_url: docs/runbooks/attachment-scanning.md#attachmentscanlatencyhigh
      - alert: AttachmentCacheErrors
        expr: sum(rate(scan_attachment_cache_total{result="error"}[10m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Attachment content cache errors
          description: >-
            More than one content cache operation per second has failed for 10 minutes (Redis
            down or slower than ATTACHMENT_CACHE_TIMEOUT_MS). Scans continue without the cache
            (every attachment is scanned in full), so clamd load rises.
          runbook_url: docs/runbooks/attachment-scanning.md#attachmentcacheerrors
      - alert: AttachmentSignatureChanged
        expr: sum by (component) (increase(scan_attachment_signature_changes_total[30m])) > 0
        labels:
          severity: info
        annotations:
          summary: Attachment signature version changed
          description: >-
            The {{ $labels.component }} version changed in the last 30 minutes (a ClamAV
            database update or a new YARA bundle). Old cache entries are unreachable; a rescan
            job was recorded (ATTACHMENT_SIGNATURE_RESCAN=record) or started (rescan).
          runbook_url: docs/runbooks/attachment-scanning.md#attachmentsignaturechanged
      - alert: SandboxSubmissionsAccumulating
        expr: max(rabbitmq_detailed_queue_messages_ready{vhost="email-gateway",queue="scan.sandbox"}) > 5000
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Sandbox submissions accumulating
          description: >-
            scan.sandbox holds more than 5000 sandbox_requested.v1 events for 15 minutes. Until
            step 4.6 the queue is a bounded dormant buffer (drop-head): this is expected volume
            information, not a failure.
          runbook_url: docs/runbooks/attachment-scanning.md#sandboxsubmissionsaccumulating
