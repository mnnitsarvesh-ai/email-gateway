# promtool unit tests of rules/api-mode.rules.yml (step API-1 D11.5):
#   docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" --entrypoint promtool \
#     prom/prometheus:v3.6.0 test rules /m/tests/api-mode.rules.test.yml
rule_files:
  - ../rules/api-mode.rules.yml
evaluation_interval: 1m
tests:
  - name: failing connections (leader gauge, max over replicas)
    interval: 1m
    input_series:
      - series: api_mode_connections{job="mailbox-worker",instance="a",health="failing"}
        values: 2x40
      - series: api_mode_connections{job="mailbox-worker",instance="b",health="failing"}
        values: '0x40'
      - series: api_mode_connections{job="mailbox-worker",instance="a",health="healthy"}
        values: 7x40
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeConnectionsFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: ApiModeConnectionsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: API-mode connections are failing
              description: >-
                2 API-mode connection(s) have been failing for 15 minutes (connection inactive or
                unbound, no intake, revoked mailbox access with feeds enabled, journal source
                failing, coverage or lag beyond the fail thresholds). Their organizations were
                alerted (api_mode_unhealthy); see the failing checks on the connection.
              runbook_url: docs/runbooks/api-mode.md#apimodeconnectionsfailing
  - name: coverage gaps for six hours
    interval: 1m
    input_series:
      - series: api_mode_mailboxes{job="mailbox-worker",instance="a",coverage="gap"}
        values: 3x400
      - series: api_mode_mailboxes{job="mailbox-worker",instance="a",coverage="covered"}
        values: 90x400
    alert_rule_test:
      - eval_time: 5h
        alertname: ApiModeCoverageGaps
        exp_alerts: []
      - eval_time: 6h30m
        alertname: ApiModeCoverageGaps
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: API-mode mailboxes have coverage gaps
              description: >-
                3 in-scope mailbox(es) have had neither a healthy feed nor a journal copy within
                the coverage window for 6 hours.
              runbook_url: docs/runbooks/api-mode.md#apimodecoveragegaps
  - name: lag p95 above 900 s
    interval: 1m
    input_series:
      # Every copy lands in the 3600 s bucket: p95 between 900 s and 3600 s.
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="60"}
        values: '0x60'
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="300"}
        values: '0x60'
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="900"}
        values: '0x60'
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="3600"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="14400"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="+Inf"}
        values: 0+10x60
      # A fast source alone would not alert.
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="60"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeLagHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: ApiModeLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: API-mode detection lag p95 is above 15 minutes
              description: >-
                The p95 lag from provider delivery to the copy verdict has been above 900 s for 15
                minutes (journal delays, feed polling, throttling or a scanning backlog).
              runbook_url: docs/runbooks/api-mode.md#apimodelaghigh
  - name: fast lag does not alert
    interval: 1m
    input_series:
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="60"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="300"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="900"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="+Inf"}
        values: 0+10x60
    alert_rule_test:
      - eval_time: 50m
        alertname: ApiModeLagHigh
        exp_alerts: []
  - name: sustained throttling per provider family
    interval: 1m
    input_series:
      # 12 pauses per minute (0.2/s) for Graph; Gmail throttled once only.
      - series: api_mode_throttled_total{job="mailbox-worker",instance="a",provider="microsoft_365",family="graph"}
        values: 0+12x60
      - series: api_mode_throttled_total{job="mailbox-worker",instance="a",provider="google_workspace",family="gmail"}
        values: 0 1x60
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiModeThrottlingSustained
        exp_alerts: []
      - eval_time: 45m
        alertname: ApiModeThrottlingSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: microsoft_365
              family: graph
            exp_annotations:
              summary: Provider throttling of API mode is sustained (microsoft_365 graph)
              description: >-
                More than one throttling answer per 10 seconds from microsoft_365 (graph) for 30
                minutes: connection families are paused for their Retry-After and feeds fall
                behind.
              runbook_url: docs/runbooks/api-mode.md#apimodethrottlingsustained
  - name: cursor resets within the hour
    interval: 1m
    input_series:
      - series: api_mode_cursor_resets_total{job="mailbox-worker",instance="a",provider="google_workspace"}
        values: 0x10 1x100
      - series: api_mode_cursor_resets_total{job="mailbox-worker",instance="a",provider="microsoft_365"}
        values: '0x110'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiModeCursorResets
        exp_alerts: []
      - eval_time: 30m
        alertname: ApiModeCursorResets
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: google_workspace
            exp_annotations:
              summary: API-mode feed cursors expired (google_workspace)
              description: >-
                Mailbox feed cursors of google_workspace expired in the last hour and were
                re-initialized without backfill: mail delivered while the cursor was invalid is
                only covered by the journal (gaps are recorded per mailbox).
              runbook_url: docs/runbooks/api-mode.md#apimodecursorresets
      - eval_time: 100m
        alertname: ApiModeCursorResets
        exp_alerts: []
  - name: email.mailbox backlog
    interval: 1m
    input_series:
      - series: rabbitmq_detailed_queue_messages_ready{job="rabbitmq-detailed",vhost="email-gateway",queue="email.mailbox"}
        values: 12000x40
      - series: rabbitmq_detailed_queue_messages_ready{job="rabbitmq-detailed",vhost="email-gateway",queue="email.archive"}
        values: 50000x40
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeCopyQueueBacklog
        exp_alerts: []
      - eval_time: 20m
        alertname: ApiModeCopyQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The email.mailbox queue has a backlog
              description: >-
                12000 copy_scanned events have been waiting in email.mailbox for 15 minutes:
                per-mailbox copies stay pending (the mailbox-worker copies role is down, slow or
                failing).
              runbook_url: docs/runbooks/api-mode.md#apimodecopyqueuebacklog
  # Step API-2 (note 36 R14): remediation alerts.
  - name: remediation failure share above 20 %
    interval: 1m
    input_series:
      # 3 failed and 7 succeeded per minute on Graph: 30 % failed.
      - series: api_mode_remediations_total{job="mailbox-worker",instance="a",provider="microsoft_365",action="move_quarantine",result="failed"}
        values: 0+3x60
      - series: api_mode_remediations_total{job="mailbox-worker",instance="a",provider="microsoft_365",action="move_quarantine",result="succeeded"}
        values: 0+7x60
      # Gmail: 1 failed and 9 succeeded per minute (10 %): quiet.
      - series: api_mode_remediations_total{job="mailbox-worker",instance="a",provider="google_workspace",action="tag",result="failed"}
        values: 0+1x60
      - series: api_mode_remediations_total{job="mailbox-worker",instance="a",provider="google_workspace",action="tag",result="already_in_target"}
        values: 0+9x60
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeRemediationFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: ApiModeRemediationFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: microsoft_365
            exp_annotations:
              summary: API-mode remediations are failing (microsoft_365)
              description: >-
                More than 20 % of the microsoft_365 remediation actions completed in the last 15
                minutes failed (revoked mailbox access, provider refusals, messages not found or
                retries exhausted): detected threats stay in mailboxes. See the failed rows on the
                API-mode History tab and the remediation.failures_1h connection check.
              runbook_url: docs/runbooks/api-mode.md#apimoderemediationfailing
  - name: remediation backlog by size or age (leader gauges)
    interval: 1m
    input_series:
      - series: api_mode_remediation_backlog{job="mailbox-worker",instance="a",provider="microsoft_365"}
        values: 800x40
      - series: api_mode_remediation_backlog{job="mailbox-worker",instance="b",provider="microsoft_365"}
        values: '0x40'
      - series: api_mode_remediation_oldest_pending_seconds{job="mailbox-worker",instance="a",provider="microsoft_365"}
        values: 120x40
      # Gmail: few rows, but the oldest is two hours old.
      - series: api_mode_remediation_backlog{job="mailbox-worker",instance="a",provider="google_workspace"}
        values: 3x40
      - series: api_mode_remediation_oldest_pending_seconds{job="mailbox-worker",instance="a",provider="google_workspace"}
        values: 7200x40
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeRemediationBacklog
        exp_alerts: []
      - eval_time: 20m
        alertname: ApiModeRemediationBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: microsoft_365
            exp_annotations:
              summary: API-mode remediation backlog (microsoft_365)
              description: >-
                microsoft_365 remediation actions are queuing (more than 500 pending, or the oldest
                pending for more than an hour) for 15 minutes: throttling, a paused connection or
                too few remediate replicas.
              runbook_url: docs/runbooks/api-mode.md#apimoderemediationbacklog
          - exp_labels:
              severity: warning
              provider: google_workspace
            exp_annotations:
              summary: API-mode remediation backlog (google_workspace)
              description: >-
                google_workspace remediation actions are queuing (more than 500 pending, or the
                oldest pending for more than an hour) for 15 minutes: throttling, a paused
                connection or too few remediate replicas.
              runbook_url: docs/runbooks/api-mode.md#apimoderemediationbacklog
  - name: remediation stalled (pending, nothing succeeded for 30 minutes)
    interval: 1m
    input_series:
      - series: api_mode_remediation_backlog{job="mailbox-worker",instance="a",provider="microsoft_365"}
        values: 12x120
      # Successes stop after 20 minutes.
      - series: api_mode_remediations_total{job="mailbox-worker",instance="a",provider="microsoft_365",action="move_quarantine",result="succeeded"}
        values: 0+5x20 100x100
      # Gmail keeps succeeding with a backlog: quiet.
      - series: api_mode_remediation_backlog{job="mailbox-worker",instance="a",provider="google_workspace"}
        values: 4x120
      - series: api_mode_remediations_total{job="mailbox-worker",instance="a",provider="google_workspace",action="tag",result="succeeded"}
        values: 0+2x120
    alert_rule_test:
      - eval_time: 45m
        alertname: ApiModeRemediationStalled
        exp_alerts: []
      - eval_time: 85m
        alertname: ApiModeRemediationStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              provider: microsoft_365
            exp_annotations:
              summary: API-mode remediation is stalled (microsoft_365)
              description: >-
                microsoft_365 remediation actions are pending and none has succeeded for 30
                minutes: the remediate role is down, cannot reach the provider or the database, or
                every connection is throttled.
              runbook_url: docs/runbooks/api-mode.md#apimoderemediationstalled
  # Step API-3 (C13).
  - name: clawback stalled (active, no target progress for 60 minutes)
    interval: 1m
    input_series:
      - series: api_mode_clawback_active{job="mailbox-worker",instance="a",status="running"}
        values: 1x150
      - series: api_mode_clawback_active{job="mailbox-worker",instance="b",status="running"}
        values: 0x150
      # Targets complete for 30 minutes, then nothing.
      - series: api_mode_clawback_targets_total{job="mailbox-worker",instance="a",result="succeeded"}
        values: 0+3x30 90x120
    alert_rule_test:
      - eval_time: 60m
        alertname: ApiModeClawbackStalled
        exp_alerts: []
      - eval_time: 105m
        alertname: ApiModeClawbackStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: API-mode clawbacks are not progressing
              description: >-
                1 clawback(s) are queued or running and no clawback target was queued or completed
                in the last 60 minutes: the clawback or remediate role is down, the connections are
                paused or throttled, or the per-connection pending cap is exhausted. See the
                clawback.stalled connection check.
              runbook_url: docs/runbooks/api-mode.md#apimodeclawbackstalled
  - name: clawback quiet while targets progress
    interval: 1m
    input_series:
      - series: api_mode_clawback_active{job="mailbox-worker",instance="a",status="queued"}
        values: 2x150
      - series: api_mode_clawback_targets_total{job="mailbox-worker",instance="a",result="queued"}
        values: 0+1x150
    alert_rule_test:
      - eval_time: 140m
        alertname: ApiModeClawbackStalled
        exp_alerts: []
  - name: clawback target failures above 20 % for 30 minutes
    interval: 1m
    input_series:
      - series: api_mode_clawback_targets_total{job="mailbox-worker",instance="a",result="succeeded"}
        values: 0+4x120
      # Failures start after 30 minutes at 1 per minute (20 % of 5 → not above), then 3 per minute.
      - series: api_mode_clawback_targets_total{job="mailbox-worker",instance="a",result="failed"}
        values: 0x30 0+1x30 30+3x60
    alert_rule_test:
      - eval_time: 55m
        alertname: ApiModeClawbackFailures
        exp_alerts: []
      - eval_time: 115m
        alertname: ApiModeClawbackFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: API-mode clawback targets are failing
              description: >-
                More than 20 % of the clawback targets completed in the last 30 minutes failed
                (revoked mailbox access, provider refusals, messages not found or retries
                exhausted): clawed-back threats stay in mailboxes. See the failed targets on the
                clawback detail.
              runbook_url: docs/runbooks/api-mode.md#apimodeclawbackfailures
  - name: reports untriaged for more than 24 hours
    interval: 1m
    input_series:
      - series: api_mode_reports_pending{job="mailbox-worker",instance="a"}
        values: 3x60
      - series: api_mode_reports_pending{job="mailbox-worker",instance="b"}
        values: 0x60
      # The oldest pending report crosses 24 h after 20 minutes.
      - series: api_mode_reports_oldest_pending_seconds{job="mailbox-worker",instance="a"}
        values: 85200+60x60
    alert_rule_test:
      - eval_time: 25m
        alertname: ApiModeReportsUntriaged
        exp_alerts: []
      - eval_time: 45m
        alertname: ApiModeReportsUntriaged
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: User-reported messages are waiting for triage
              description: >-
                User reports are pending triage and the oldest has waited more than 24 hours: no
                analyst is triaging the report mailbox queue. See the reports.backlog connection
                check and the Reports tab.
              runbook_url: docs/runbooks/api-mode.md#apimodereportsuntriaged
  - name: reports quiet without a backlog
    interval: 1m
    input_series:
      - series: api_mode_reports_pending{job="mailbox-worker",instance="a"}
        values: 0x60
      - series: api_mode_reports_oldest_pending_seconds{job="mailbox-worker",instance="a"}
        values: 0x60
    alert_rule_test:
      - eval_time: 50m
        alertname: ApiModeReportsUntriaged
        exp_alerts: []
  - name: detect policy evaluation errors above 5 % for 15 minutes
    interval: 1m
    input_series:
      # 10 % of the evaluations fail on replica a; replica b evaluates cleanly.
      - series: api_mode_policy_evaluations_total{job="mailbox-worker",instance="a",result="failed"}
        values: 0+6x60
      - series: api_mode_policy_evaluations_total{job="mailbox-worker",instance="a",result="evaluated"}
        values: 0+30x60
      - series: api_mode_policy_evaluations_total{job="mailbox-worker",instance="b",result="evaluated"}
        values: 0+24x60
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModePolicyEvaluationErrors
        exp_alerts: []
      - eval_time: 40m
        alertname: ApiModePolicyEvaluationErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Tenant policy evaluation of API-mode copies is failing
              description: >-
                More than 5 % of the detect-mode policy evaluations of API-mode copy messages
                failed for 15 minutes (malformed round rows or evaluator errors): those copies are
                remediated by the verdict rules only, without the tenants' policies and DLP
                bindings. See the policy.errors_1h connection check and the mailbox-worker error
                logs.
              runbook_url: docs/runbooks/api-mode.md#apimodepolicyevaluationerrors
  - name: detect policy evaluation errors at 5 % or less stay quiet
    interval: 1m
    input_series:
      - series: api_mode_policy_evaluations_total{job="mailbox-worker",instance="a",result="failed"}
        values: 0+1x60
      - series: api_mode_policy_evaluations_total{job="mailbox-worker",instance="a",result="evaluated"}
        values: 0+40x60
      - series: api_mode_policy_evaluations_total{job="mailbox-worker",instance="a",result="disabled"}
        values: 0+100x60
    alert_rule_test:
      - eval_time: 50m
        alertname: ApiModePolicyEvaluationErrors
        exp_alerts: []
