# promtool unit tests of rules/api-mode.rules.yml (step API-1 D11.5):
#   docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" --entrypoint promtool \
#     prom/prometheus:v3.6.0 test rules /m/tests/api-mode.rules.test.yml
rule_files:
  - ../rules/api-mode.rules.yml
evaluation_interval: 1m
tests:
  - name: failing connections (leader gauge, max over replicas)
    interval: 1m
    input_series:
      - series: api_mode_connections{job="mailbox-worker",instance="a",health="failing"}
        values: 2x40
      - series: api_mode_connections{job="mailbox-worker",instance="b",health="failing"}
        values: '0x40'
      - series: api_mode_connections{job="mailbox-worker",instance="a",health="healthy"}
        values: 7x40
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeConnectionsFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: ApiModeConnectionsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: API-mode connections are failing
              description: >-
                2 API-mode connection(s) have been failing for 15 minutes (connection inactive or
                unbound, no intake, revoked mailbox access with feeds enabled, journal source
                failing, coverage or lag beyond the fail thresholds). Their organizations were
                alerted (api_mode_unhealthy); see the failing checks on the connection.
              runbook_url: docs/runbooks/api-mode.md#apimodeconnectionsfailing
  - name: coverage gaps for six hours
    interval: 1m
    input_series:
      - series: api_mode_mailboxes{job="mailbox-worker",instance="a",coverage="gap"}
        values: 3x400
      - series: api_mode_mailboxes{job="mailbox-worker",instance="a",coverage="covered"}
        values: 90x400
    alert_rule_test:
      - eval_time: 5h
        alertname: ApiModeCoverageGaps
        exp_alerts: []
      - eval_time: 6h30m
        alertname: ApiModeCoverageGaps
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: API-mode mailboxes have coverage gaps
              description: >-
                3 in-scope mailbox(es) have had neither a healthy feed nor a journal copy within
                the coverage window for 6 hours.
              runbook_url: docs/runbooks/api-mode.md#apimodecoveragegaps
  - name: lag p95 above 900 s
    interval: 1m
    input_series:
      # Every copy lands in the 3600 s bucket: p95 between 900 s and 3600 s.
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="60"}
        values: '0x60'
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="300"}
        values: '0x60'
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="900"}
        values: '0x60'
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="3600"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="14400"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="journal",le="+Inf"}
        values: 0+10x60
      # A fast source alone would not alert.
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="60"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeLagHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: ApiModeLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: API-mode detection lag p95 is above 15 minutes
              description: >-
                The p95 lag from provider delivery to the copy verdict has been above 900 s for 15
                minutes (journal delays, feed polling, throttling or a scanning backlog).
              runbook_url: docs/runbooks/api-mode.md#apimodelaghigh
  - name: fast lag does not alert
    interval: 1m
    input_series:
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="60"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="300"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="900"}
        values: 0+10x60
      - series: api_mode_lag_seconds_bucket{job="mailbox-worker",instance="a",source="graph",le="+Inf"}
        values: 0+10x60
    alert_rule_test:
      - eval_time: 50m
        alertname: ApiModeLagHigh
        exp_alerts: []
  - name: sustained throttling per provider family
    interval: 1m
    input_series:
      # 12 pauses per minute (0.2/s) for Graph; Gmail throttled once only.
      - series: api_mode_throttled_total{job="mailbox-worker",instance="a",provider="microsoft_365",family="graph"}
        values: 0+12x60
      - series: api_mode_throttled_total{job="mailbox-worker",instance="a",provider="google_workspace",family="gmail"}
        values: 0 1x60
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiModeThrottlingSustained
        exp_alerts: []
      - eval_time: 45m
        alertname: ApiModeThrottlingSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: microsoft_365
              family: graph
            exp_annotations:
              summary: Provider throttling of API mode is sustained (microsoft_365 graph)
              description: >-
                More than one throttling answer per 10 seconds from microsoft_365 (graph) for 30
                minutes: connection families are paused for their Retry-After and feeds fall
                behind.
              runbook_url: docs/runbooks/api-mode.md#apimodethrottlingsustained
  - name: cursor resets within the hour
    interval: 1m
    input_series:
      - series: api_mode_cursor_resets_total{job="mailbox-worker",instance="a",provider="google_workspace"}
        values: 0x10 1x100
      - series: api_mode_cursor_resets_total{job="mailbox-worker",instance="a",provider="microsoft_365"}
        values: '0x110'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiModeCursorResets
        exp_alerts: []
      - eval_time: 30m
        alertname: ApiModeCursorResets
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: google_workspace
            exp_annotations:
              summary: API-mode feed cursors expired (google_workspace)
              description: >-
                Mailbox feed cursors of google_workspace expired in the last hour and were
                re-initialized without backfill: mail delivered while the cursor was invalid is
                only covered by the journal (gaps are recorded per mailbox).
              runbook_url: docs/runbooks/api-mode.md#apimodecursorresets
      - eval_time: 100m
        alertname: ApiModeCursorResets
        exp_alerts: []
  - name: email.mailbox backlog
    interval: 1m
    input_series:
      - series: rabbitmq_detailed_queue_messages_ready{job="rabbitmq-detailed",vhost="email-gateway",queue="email.mailbox"}
        values: 12000x40
      - series: rabbitmq_detailed_queue_messages_ready{job="rabbitmq-detailed",vhost="email-gateway",queue="email.archive"}
        values: 50000x40
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiModeCopyQueueBacklog
        exp_alerts: []
      - eval_time: 20m
        alertname: ApiModeCopyQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The email.mailbox queue has a backlog
              description: >-
                12000 copy_scanned events have been waiting in email.mailbox for 15 minutes:
                per-mailbox copies stay pending (the mailbox-worker copies role is down, slow or
                failing).
              runbook_url: docs/runbooks/api-mode.md#apimodecopyqueuebacklog
