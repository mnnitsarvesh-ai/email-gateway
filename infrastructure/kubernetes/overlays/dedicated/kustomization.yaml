# Single-tenant dedicated deployment: same images, smaller footprint, config-only differences.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
# Account takeover GeoIP (step 8.4, docs/deployment/account-takeover.md): once the operator has a
# MaxMind account and the Secret email-gateway-geoip, enable the geoipupdate sidecar with
# components: [../../components/ato-geoip]
configMapGenerator:
  - name: email-gateway-config
    behavior: merge
    literals:
      - APP_ENV=production
      - DEPLOYMENT_MODE=dedicated
patches:
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 4
