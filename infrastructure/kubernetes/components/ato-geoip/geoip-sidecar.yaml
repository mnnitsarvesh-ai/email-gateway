# JSON patch (RFC 6902) applied to ato-detect and ato-respond: the geoipupdate sidecar, the shared
# volume, the credential volume and the database paths of the worker container (index 0).
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: geoipupdate
      image: ghcr.io/maxmind/geoipupdate:v7.1.1
      # Native sidecar (Kubernetes >= 1.29): starts before the worker and keeps running.
      restartPolicy: Always
      env:
        - { name: GEOIPUPDATE_ACCOUNT_ID_FILE, value: /var/run/secrets/geoip/account-id }
        - { name: GEOIPUPDATE_LICENSE_KEY_FILE, value: /var/run/secrets/geoip/license-key }
        # Add GeoIP2-Anonymous-IP here with a commercial licence (rule G4).
        - { name: GEOIPUPDATE_EDITION_IDS, value: 'GeoLite2-City GeoLite2-ASN' }
        - { name: GEOIPUPDATE_FREQUENCY, value: '72' }
        - { name: GEOIPUPDATE_DB_DIR, value: /var/lib/geoip }
      volumeMounts:
        - { name: geoip, mountPath: /var/lib/geoip }
        - { name: geoip-credentials, mountPath: /var/run/secrets/geoip, readOnly: true }
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
- op: add
  path: /spec/template/spec/volumes/-
  value: { name: geoip, emptyDir: { sizeLimit: 512Mi } }
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: geoip-credentials
    secret:
      secretName: email-gateway-geoip
      items:
        - { key: account-id, path: account-id }
        - { key: license-key, path: license-key }
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value: { name: geoip, mountPath: /var/lib/geoip, readOnly: true }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: ATO_GEOIP_CITY_DB_PATH, value: /var/lib/geoip/GeoLite2-City.mmdb }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: ATO_GEOIP_ASN_DB_PATH, value: /var/lib/geoip/GeoLite2-ASN.mmdb }
# The first download completes after the worker started: check for it every 5 minutes.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: ATO_GEOIP_RELOAD_SECONDS, value: '300' }
