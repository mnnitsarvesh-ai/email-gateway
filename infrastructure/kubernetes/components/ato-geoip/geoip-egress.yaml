# JSON patch: HTTPS to public addresses for the geoipupdate sidecar (updates.maxmind.com). Pod-level
# policy: the worker container itself never initiates Internet connections.
- op: add
  path: /spec/egress/-
  value:
    to:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 224.0.0.0/4
            - 240.0.0.0/4
    ports: [{ protocol: TCP, port: 443 }]
