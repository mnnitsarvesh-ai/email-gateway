# Webhook delivery (step 6.2 W8–W13, docs/plan/steps/19-webhooks-notifications.md; ADR-0055;
# docs/deployment/webhooks.md): the webhook-worker image with WEBHOOK_WORKER_ROLES=delivery. The
# database-driven loop claims due deliveries fairly per organization and subscription (Redis
# in-flight and rate counters; fail closed without Redis), decrypts the signing secrets
# (WEBHOOK_SECRET_ENCRYPTION_KEY: the api encrypts, this Deployment decrypts, nobody else holds
# it), signs and POSTs through the SSRF-guarded client (every resolved address checked, the
# validated IP dialed, no redirects, https and port 443 only), records attempts, retries,
# dead-letters, auto-disables, runs range replays and the GET_LOCK-elected maintenance.
#
# The ONLY workload allowed to reach the Internet for webhooks (TCP 443 to public addresses; the
# NetworkPolicy below). No TEST-ONLY seam is set here (WEBHOOK_ALLOW_HTTP, WEBHOOK_TEST_*,
# WEBHOOK_EXTRA_CA_PATH are refused outside APP_ENV local/ci anyway).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-delivery
  labels: { app.kubernetes.io/name: webhook-delivery, app.kubernetes.io/part-of: email-gateway }
spec:
  # Two replicas: both claim (FOR UPDATE SKIP LOCKED, shared Redis caps); maintenance runs on the
  # GET_LOCK leader only.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: webhook-delivery }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhook-delivery, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: webhook-delivery
      automountServiceAccountToken: false
      # Attempts in flight at shutdown complete (≤ WEBHOOK_HTTP_TOTAL_TIMEOUT_MS) and are recorded.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: webhook-delivery }
      containers:
        - name: webhook-delivery
          image: email-gateway/webhook-worker:latest
          ports:
            - { name: http, containerPort: 3075 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: HTTP_PORT, value: '3075' }
            - { name: WEBHOOK_WORKER_ROLES, value: delivery }
            # Delivery loop, client, retries, auto-disable, replay and maintenance (step 6.2 §4.4).
            # WEBHOOK_ALLOWED_PORTS (443) and WEBHOOK_ALLOW_HTTP (false): ConfigMap.
            - { name: WEBHOOK_DELIVERY_POLL_INTERVAL_MS, value: '500' }
            - { name: WEBHOOK_DELIVERY_CONCURRENCY, value: '32' }
            - { name: WEBHOOK_MAX_INFLIGHT_PER_ORG, value: '16' }
            - { name: WEBHOOK_MAX_INFLIGHT_PER_SUBSCRIPTION, value: '4' }
            - { name: WEBHOOK_RATE_PER_SUBSCRIPTION_PER_MINUTE, value: '600' }
            - { name: WEBHOOK_HTTP_CONNECT_TIMEOUT_MS, value: '3000' }
            - { name: WEBHOOK_HTTP_TOTAL_TIMEOUT_MS, value: '10000' }
            - { name: WEBHOOK_RESPONSE_MAX_BYTES, value: '4096' }
            # Empty = the pod's resolver (cluster DNS forwarding to a resolver without internal
            # zones), or the dedicated resolver's addresses (docs/deployment/webhooks.md).
            - { name: WEBHOOK_DNS_SERVERS, value: '' }
            - { name: WEBHOOK_MAX_ATTEMPTS, value: '8' }
            - { name: WEBHOOK_RETRY_BASE_SECONDS, value: '30' }
            - { name: WEBHOOK_RETRY_MAX_DELAY_SECONDS, value: '21600' }
            - { name: WEBHOOK_RETRY_AFTER_MAX_SECONDS, value: '3600' }
            - { name: WEBHOOK_MAX_RETRY_AGE_HOURS, value: '24' }
            - { name: WEBHOOK_DISABLE_AFTER_FAILURES, value: '50' }
            - { name: WEBHOOK_DISABLE_AFTER_HOURS, value: '24' }
            - { name: WEBHOOK_REPLAY_MAX_EVENTS, value: '10000' }
            - { name: WEBHOOK_REPLAY_MAX_PER_DELIVERY, value: '10' }
            - { name: WEBHOOK_MAINTENANCE_INTERVAL_MS, value: '60000' }
            - { name: WEBHOOK_DELETED_RETENTION_DAYS, value: '62' }
            # Secrets are mounted as files by External Secrets and read via the <KEY>_FILE convention.
            - { name: DATABASE_URL_FILE, value: /var/run/secrets/gateway/database-url }
            # RABBITMQ_WEBHOOK_URL is required by the shared configuration; this role opens no
            # broker connection.
            - {
                name: RABBITMQ_WEBHOOK_URL_FILE,
                value: /var/run/secrets/gateway/rabbitmq-webhook-url,
              }
            - { name: REDIS_URL_FILE, value: /var/run/secrets/gateway/redis-url }
            # Webhook secret cipher (W7): decrypts signing secrets. The previous key (encryption
            # key rotation, decryption only) is optional; see docs/runbooks/webhooks.md.
            - {
                name: WEBHOOK_SECRET_ENCRYPTION_KEY_FILE,
                value: /var/run/secrets/webhook-secret-key/key,
              }
            - name: WEBHOOK_SECRET_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  { name: email-gateway-webhook-secret-key, key: previous-key, optional: true }
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
            - {
                name: webhook-secret-key,
                mountPath: /var/run/secrets/webhook-secret-key,
                readOnly: true,
              }
            - { name: tmp, mountPath: /tmp }
          # Readiness: mysql and redis; the maintenance leadership is a metric, not a gate.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret: { secretName: email-gateway-secrets }
        - name: webhook-secret-key
          secret:
            secretName: email-gateway-webhook-secret-key
            items: [{ key: key, path: key }]
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-delivery
---
# Metrics (/metrics) and health on the http port.
apiVersion: v1
kind: Service
metadata:
  name: webhook-delivery
  labels: { app.kubernetes.io/name: webhook-delivery }
spec:
  selector: { app.kubernetes.io/name: webhook-delivery }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhook-delivery
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: webhook-delivery }
---
# Egress of the delivery role (docs/deployment/webhooks.md): MySQL, Redis, DNS, OTLP and HTTPS
# (443) to PUBLIC addresses only. The SSRF guard is the authoritative check of every resolved
# address; this policy is the second layer (private, CGNAT, link-local/metadata, loopback,
# multicast and reserved ranges are never reachable). No RabbitMQ: the role has no broker client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-delivery
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: webhook-delivery }
  policyTypes: [Ingress, Egress]
  ingress:
    # Metrics and probes only (Prometheus; the kubelet's probes are not subject to policies).
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ protocol: TCP, port: 3075 }]
  egress:
    # MySQL writer (RDS/Aurora subnet).
    - to: [{ ipBlock: { cidr: 10.0.32.0/20 } }]
      ports: [{ protocol: TCP, port: 3306 }]
    # Redis (ElastiCache subnet): in-flight and rate counters.
    - to: [{ ipBlock: { cidr: 10.0.48.0/20 } }]
      ports: [{ protocol: TCP, port: 6379 }]
    # Cluster DNS (or replace with the dedicated resolver's ipBlock, WEBHOOK_DNS_SERVERS).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    # OTLP traces / logs to the collector.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports: [{ protocol: TCP, port: 4318 }]
    # Tenant webhook endpoints: HTTPS to public addresses only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::1/128
              - 64:ff9b::/96
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports: [{ protocol: TCP, port: 443 }]
