# Policy engine (step 5.2, docs/plan/steps/16-policy-engine.md P13, docs/deployment/policy-engine.md):
# consumes email.policy.evaluate as the role user eg-policy-engine and is the only automatic
# producer of delivery approvals (ADR-0044). Step 5.3 (Q28, ADR-0046 decision 6): this Deployment
# runs the `evaluate` role only (it also writes the quarantine entries in the evaluation
# transaction); the `quarantine` role (release executor, sweeper, digests) runs in
# quarantine-worker.yaml from the same image, so a quarantine defect never stops the delivery gate.
# It signs click tokens for URL_REWRITE after the scan (ADR-0049: URL_TOKEN_KEY_CURRENT, sign only). Writer-only MySQL, the mail bucket (reads the
# delivered object, writes policy copies under org/<org>/policy/ tagged eg-object=policy-copy;
# S3 access through the pod's IAM role, IRSA, in production), Redis for readiness. At least two
# replicas: an outage holds every scanned message (alert PolicyEvaluationsStalled).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-engine
  labels: { app.kubernetes.io/name: policy-engine, app.kubernetes.io/part-of: email-gateway }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: policy-engine }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: policy-engine, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: policy-engine
      automountServiceAccountToken: false
      # Longer than one evaluation transaction budget (POLICY_DB_TX_TIMEOUT_MS) plus the stop grace.
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: policy-engine }
      containers:
        - name: policy-engine
          image: email-gateway/policy-engine:latest
          ports:
            - { name: http, containerPort: 3030 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: HTTP_PORT, value: '3030' }
            # Policy engine (step 5.2 §5); POLICY_PLATFORM_DEFAULT comes from the ConfigMap.
            - { name: POLICY_EVALUATE_PREFETCH, value: '8' }
            - { name: POLICY_DB_TX_TIMEOUT_MS, value: '120000' }
            - { name: POLICY_SNAPSHOT_CACHE_MAX_ENTRIES, value: '1000' }
            - { name: POLICY_COPY_MAX_MESSAGE_BYTES, value: '26214400' }
            - { name: POLICY_COPY_MAX_HEADER_BYTES, value: '262144' }
            # Step 5.3 Q28: the delivery gate only; quarantine-worker runs the quarantine role.
            - { name: POLICY_ENGINE_ROLES, value: evaluate }
            # WARN banners and URL_REWRITE after the scan (Q22, Q23); URL_CLICK_BASE_URL, token
            # expiry and rewrite size bounds come from the ConfigMap.
            - { name: POLICY_BANNER_MAX_PART_BYTES, value: '1048576' }
            - { name: POLICY_URL_REWRITE_ENABLED, value: 'true' }
            # Secrets are mounted as files by External Secrets and read via the <KEY>_FILE convention.
            - { name: DATABASE_URL_FILE, value: /var/run/secrets/gateway/database-url }
            # Role user eg-policy-engine (step 5.2 P15): consumes email.policy.evaluate.
            - {
                name: RABBITMQ_POLICY_ENGINE_URL_FILE,
                value: /var/run/secrets/gateway/rabbitmq-policy-engine-url,
              }
            - { name: REDIS_URL_FILE, value: /var/run/secrets/gateway/redis-url }
            # Click-token signing (ADR-0049): the CURRENT key and id only, never the previous key.
            - { name: URL_TOKEN_KEY_CURRENT_FILE, value: /var/run/secrets/url-token/current }
            - name: URL_TOKEN_KEY_CURRENT_ID
              valueFrom:
                secretKeyRef: { name: email-gateway-url-token-keys, key: current-id }
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
            - { name: token-keys, mountPath: /var/run/secrets/url-token, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret: { secretName: email-gateway-secrets }
        - name: token-keys
          secret:
            secretName: email-gateway-url-token-keys
            items: [{ key: current, path: current }]
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-engine
---
apiVersion: v1
kind: Service
metadata:
  name: policy-engine
  labels: { app.kubernetes.io/name: policy-engine }
spec:
  selector: { app.kubernetes.io/name: policy-engine }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policy-engine
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: policy-engine }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: policy-engine
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: policy-engine }
