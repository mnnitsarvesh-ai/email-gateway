apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  labels: { app.kubernetes.io/name: notification-worker, app.kubernetes.io/part-of: email-gateway }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: notification-worker }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        { app.kubernetes.io/name: notification-worker, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: notification-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: notification-worker }
      containers:
        - name: notification-worker
          image: email-gateway/notification-worker:latest
          ports:
            - { name: http, containerPort: 3050 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: HTTP_PORT, value: '3050' }
            # Policy notifications (step 5.2 §5, P25). NOTIFY_SMTP_HOST/PORT/SECURE/FROM/USER and
            # PORTAL_PUBLIC_URL come from the ConfigMap and the overlay (TLS in production).
            - { name: NOTIFICATION_PREFETCH, value: '4' }
            - { name: NOTIFICATION_DB_TX_TIMEOUT_MS, value: '120000' }
            - { name: NOTIFICATION_MAX_RECIPIENTS, value: '50' }
            # Secrets are mounted as files by External Secrets and read via the <KEY>_FILE convention.
            - { name: DATABASE_URL_FILE, value: /var/run/secrets/gateway/database-url }
            # Role user eg-notification (step 5.2 P15): consumes email.notifications.
            - {
                name: RABBITMQ_NOTIFICATION_URL_FILE,
                value: /var/run/secrets/gateway/rabbitmq-notification-url,
              }
            - {
                name: NOTIFY_SMTP_PASSWORD_FILE,
                value: /var/run/secrets/gateway/notify-smtp-password,
              }
            - { name: REDIS_URL_FILE, value: /var/run/secrets/gateway/redis-url }
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret: { secretName: email-gateway-secrets }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-worker
---
apiVersion: v1
kind: Service
metadata:
  name: notification-worker
  labels: { app.kubernetes.io/name: notification-worker }
spec:
  selector: { app.kubernetes.io/name: notification-worker }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: notification-worker }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-worker
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notification-worker }
