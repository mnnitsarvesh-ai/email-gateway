apiVersion: v1
kind: ConfigMap
metadata:
  name: email-gateway-config
data:
  NODE_ENV: production
  # The shared base config schema defaults APP_ENV to `local`, which would allow local-only
  # behaviour (TEST-ONLY URL seams, plaintext SMTP, http click host). Overlays set `staging`.
  APP_ENV: production
  LOG_LEVEL: info
  HTTP_HOST: 0.0.0.0
  S3_REGION: ap-south-1
  S3_BUCKET_MAIL: replace-per-environment
  S3_BUCKET_ARCHIVE: replace-per-environment
  # Read replica lag handling (api only; data-plane services ignore these).
  DATABASE_READ_MAX_LAG_SECONDS: '10'
  DATABASE_READ_LAG_CHECK_INTERVAL_MS: '5000'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  # api: one reverse-proxy hop (ALB / ingress) in front of the pods; drives client IPs.
  HTTP_TRUST_PROXY: '1'
  # api: links in invitation/reset/verification emails. Set per overlay (https required).
  PORTAL_PUBLIC_URL: https://portal.replace-per-environment.invalid
  # Session and token lifetimes (api; defaults of design D15).
  AUTH_ACCESS_TOKEN_TTL_SECONDS: '600'
  AUTH_REFRESH_TOKEN_TTL_SECONDS: '604800'
  AUTH_SESSION_MAX_AGE_SECONDS: '2592000'
  AUTH_PASSWORD_RESET_TTL_SECONDS: '1800'
  AUTH_EMAIL_VERIFICATION_TTL_SECONDS: '86400'
  AUTH_INVITATION_TTL_SECONDS: '604800'
  # Transactional-email relay (api now, notification-worker later). NOTIFY_SMTP_HOST,
  # NOTIFY_SMTP_FROM and NOTIFY_SMTP_USER are set per overlay; the password is a secret file.
  # A relay with a self-signed certificate: mount the certificate from a Secret and set
  # NOTIFY_SMTP_CA_PATH to the mounted file path in the overlay (verification stays on).
  NOTIFY_SMTP_PORT: '587'
  NOTIFY_SMTP_SECURE: starttls
  # Domain onboarding and DNS (api, step 2.1; ADR-0017). DNS_SERVERS empty = the pod's resolver
  # (cluster DNS / VPC resolver). DNS_RESOLVER_MODE=doh sends customer domain names to the
  # DNS_DOH_URL provider (https only); set DNS_PROPAGATION_UPSTREAMS per overlay if wanted.
  DNS_RESOLVER_MODE: system
  DNS_DOH_URL: https://cloudflare-dns.com/dns-query
  DNS_TIMEOUT_MS: '2500'
  DNS_TRIES: '2'
  DNS_CACHE_MAX_TTL_SECONDS: '300'
  DNS_CACHE_NEGATIVE_TTL_SECONDS: '60'
  # Where customers point their MX and the SPF record they include: no default in the api.
  # Replace per environment with the gateway's real public names (priority:host list).
  GATEWAY_MX_HOSTS: 10:mx1.replace-per-environment.invalid,20:mx2.replace-per-environment.invalid
  GATEWAY_SPF_INCLUDE: _spf.replace-per-environment.invalid
  DOMAIN_VERIFICATION_LABEL: _emailgateway-verify
  DOMAIN_VERIFICATION_TTL_DAYS: '7'
  DOMAIN_BACKGROUND_JOBS_ENABLED: 'true'
  DOMAIN_JOBS_INTERVAL_SECONDS: '30'
  DOMAIN_CHECK_BATCH_SIZE: '50'
  DOMAIN_CHECK_CONCURRENCY: '4'
  DOMAIN_CHECK_DEADLINE_MS: '15000'
  DOMAIN_RETRY_BASE_SECONDS: '60'
  DOMAIN_RETRY_MAX_SECONDS: '3600'
  DOMAIN_RECHECK_INCOMPLETE_SECONDS: '1800'
  DOMAIN_RECHECK_INTERVAL_SECONDS: '86400'
  DKIM_ROTATION_OVERLAP_DAYS: '7'
  # Security scanning (step 4.1 §5, S8): the inbound Rspamd scan pool (normal worker /checkv2 and
  # controller), and the platform Rspamd thresholds read by both the api and email-worker-scan
  # (they must agree: the api validates tenant overrides against them). Rspamd endpoints are set
  # per environment.
  SCAN_RSPAMD_URL: http://rspamd-scan.replace-per-environment.invalid:11333
  RSPAMD_CONTROLLER_URL: http://rspamd-scan.replace-per-environment.invalid:11334
  SCAN_RSPAMD_SPAM_SCORE: '6'
  SCAN_RSPAMD_SUSPICIOUS_SCORE: '4'
  SCAN_RSPAMD_SCORE_MIN: '1'
  SCAN_RSPAMD_SCORE_MAX: '15'
  SCAN_RSPAMD_PHISHING_VERDICT: suspicious
  SCAN_RSPAMD_DMARC_REJECT_VERDICT: suspicious
  SCAN_RSPAMD_AUTH_FAILURE_VERDICT: reason_only
  # Attachment scanning (step 4.2 §5, A8): the platform attachment settings read by both the api
  # (tenant override bounds) and the email-worker scan replicas; the required engines of a round
  # (SCAN_ENGINES) must be identical on every scan replica (A1). Step 4.3 U1 adds the required url
  # engine (Deployment email-worker-url); step 4.4 B1 the required stage-2 bec engine (Deployment
  # email-worker-bec, triggered by the rspamd and url finals of the round); step 4.5 D1 the
  # required stage-1 dlp engine (Deployment email-worker-dlp). Rollout of dlp is two-phase
  # (docs/deployment/dlp.md): deploy the new image everywhere with SCAN_ENGINES unchanged and
  # email-worker-dlp running, then add dlp here; a round that requires dlp while nobody consumes
  # scan.dlp ends scan_failed at its deadline (never clean).
  SCAN_ENGINES: rspamd,attachment,url,bec,dlp
  ATTACHMENT_MAX_BYTES: '26214400'
  ATTACHMENT_ARCHIVE_MAX_DEPTH: '3'
  ATTACHMENT_ARCHIVE_MAX_ENTRIES: '1000'
  ATTACHMENT_MAX_ENTRY_BYTES: '26214400'
  ATTACHMENT_MAX_DECOMPRESSED_BYTES: '104857600'
  ATTACHMENT_MAX_COMPRESSION_RATIO: '100'
  ATTACHMENT_MAX_ENTRY_FINDINGS: '20'
  ATTACHMENT_DENIED_TYPES: pe_executable,msi,elf,macho,lnk,script_js,script_vbs,script_ps1,script_batch,hta,jar,apk,iso,vhd,chm
  ATTACHMENT_DENIED_TYPE_VERDICT: suspicious
  ATTACHMENT_TYPE_MISMATCH_VERDICT: suspicious
  ATTACHMENT_ENCRYPTED_VERDICT: suspicious
  ATTACHMENT_RESCAN_MAX_MESSAGES: '5000'
  ATTACHMENT_RESCAN_WINDOW_HOURS: '24'
  # URL protection (step 4.3 §5; docs/deployment/url-protection.md). Shared, non-secret platform
  # keys of the url engine (email-worker-url), the click-service and the api (bounds). Secrets
  # (URL_TOKEN_KEY_*, URL_CACHE_HMAC_KEY, URL_EGRESS_PROXY_TOKEN, the click account) are separate
  # Secrets. The browser worker and the egress proxy do NOT read this ConfigMap (they refuse S3_*
  # and URL_TOKEN_* keys). TEST-ONLY keys (URL_FETCH_TEST_*, URL_FETCH_CA_FILE) are never set.
  SCAN_URL_CONCURRENCY: '4'
  SCAN_URL_TIMEOUT_MS: '120000'
  SCAN_URL_MAX_ATTEMPTS: '6'
  URL_MAX_PER_MESSAGE: '200'
  URL_MAX_OCCURRENCES: '5000'
  URL_MAX_LENGTH: '2048'
  URL_MAX_PART_BYTES: '10485760'
  URL_MAX_EXTRA_PARTS: '5'
  URL_EXTRA_PART_MAX_BYTES: '2097152'
  URL_EXTRACT_TIMEOUT_MS: '5000'
  # Providers: local_feed always; add dnsbl (and the zones, e.g. Spamhaus DQS with the key in the
  # zone name, SURBL, URIBL) and rdap per overlay. A misspelled DNSBL zone answers NXDOMAIN, which
  # reads as `clear`: never enable dnsbl with placeholder zones.
  URL_REPUTATION_PROVIDERS: local_feed
  URL_DNSBL_DOMAIN_ZONES: ''
  URL_DNSBL_IP_ZONES: ''
  URL_DNSBL_ERROR_CODES: 127.255.255.252,127.255.255.254,127.255.255.255,127.0.1.255
  URL_RDAP_BASE_URL: ''
  URL_NEW_DOMAIN_DAYS: '30'
  URL_PROVIDER_TIMEOUT_MS: '3000'
  URL_PROVIDER_CONCURRENCY: '16'
  URL_PROVIDER_BREAKER_THRESHOLD: '5'
  URL_PROVIDER_BREAKER_RESET_MS: '30000'
  # A recursive resolver that does not serve internal zones (deployment doc); empty = resolv.conf.
  URL_DNS_SERVERS: ''
  URL_DNS_TIMEOUT_MS: '2000'
  URL_DNS_TRIES: '2'
  URL_CACHE_ENABLED: 'true'
  URL_CACHE_CLEAN_TTL_SECONDS: '900'
  URL_CACHE_MALICIOUS_TTL_SECONDS: '86400'
  URL_CACHE_OTHER_TTL_SECONDS: '300'
  URL_CACHE_ERROR_TTL_SECONDS: '30'
  URL_CACHE_TIMEOUT_MS: '200'
  URL_SCAN_TIME_FETCH: suspicious
  URL_FETCH_MAX_PER_MESSAGE: '10'
  URL_FETCH_MAX_HOPS: '8'
  URL_FETCH_SUSPICIOUS_HOPS: '4'
  URL_FETCH_CONNECT_TIMEOUT_MS: '3000'
  URL_FETCH_HEADER_TIMEOUT_MS: '5000'
  URL_FETCH_TOTAL_TIMEOUT_MS: '10000'
  URL_FETCH_MAX_BODY_BYTES: '262144'
  URL_FETCH_MAX_HEADER_BYTES: '16384'
  URL_FETCH_CONCURRENCY: '8'
  URL_FETCH_ALLOWED_PORTS: 80,443
  # The platform's own public ranges and names (replace per environment).
  URL_FETCH_DENY_CIDRS: ''
  URL_FETCH_DENY_HOSTS: ''
  URL_FETCH_USER_AGENT: Mozilla/5.0 (compatible; EmailGatewayLinkScanner/1.0)
  # Egress mode 2 (recommended): every fetcher through the egress proxy (url-egress-proxy.yaml);
  # the pods need the label email-gateway.io/egress-client=true and the token Secret.
  URL_FETCH_EGRESS_PROXY_URL: http://url-egress-proxy:3128
  URL_SHORTENER_HOSTS_FILE: ''
  URL_SHORTENER_EXTRA_HOSTS: ''
  URL_PROTECTED_BRANDS_FILE: ''
  URL_PROTECTED_EXTRA_DOMAINS: ''
  URL_LOOKALIKE_MIN_LABEL: '5'
  URL_LOOKALIKE_LONG_LABEL: '9'
  URL_LOOKALIKE_MAX_DISTANCE_SHORT: '1'
  URL_LOOKALIKE_MAX_DISTANCE_LONG: '2'
  URL_LOOKALIKE_HIGH_SCORE: '0.85'
  URL_REWRITE_ENABLED: 'true'
  URL_REWRITE_DIRECTIONS: inbound
  URL_REWRITE_DKIM_SIGNED: rewrite
  URL_REWRITE_MAX_MESSAGE_BYTES: '26214400'
  URL_REWRITE_MAX_PART_BYTES: '5242880'
  URL_REWRITE_OBJECT_RETENTION_DAYS: '30'
  # The click host (https required outside APP_ENV local/ci). Set per overlay.
  URL_CLICK_BASE_URL: https://protect.replace-per-environment.invalid
  URL_TOKEN_DEFAULT_EXPIRY_DAYS: '30'
  URL_TOKEN_MAX_EXPIRY_DAYS: '90'
  URL_DYNAMIC_INSPECTION: 'on'
  URL_DYNAMIC_MAX_PER_MESSAGE: '3'
  URL_DYNAMIC_PENDING_TTL_SECONDS: '3600'
  URL_DYNAMIC_SWEEP_INTERVAL_MS: '60000'
  # Phishing and BEC detection (step 4.4 §5, B13; docs/deployment/bec-detection.md). Platform
  # settings and tenant bounds read by both the api (/api/v1/scan-settings/bec, the BEC routes)
  # and email-worker-bec; they must agree. The engine-only keys are set in email-worker-bec.yaml;
  # the secrets (BEC_CONTEXT_HMAC_KEY, BEC_LLM_API_KEY) are separate Secrets mounted only there.
  # BEC_LLM_MODE is the platform cap of the LLM layer (off until the deployment doc's checklist is
  # done); tenants opt in within it.
  BEC_SUSPICIOUS_SCORE: '40'
  BEC_MALICIOUS_SCORE: '80'
  BEC_AI_RAISE_CONFIDENCE: '0.8'
  BEC_AI_CORROBORATE_CONFIDENCE: '0.9'
  BEC_AI_MALICIOUS_BAND: '10'
  BEC_LOCAL_MODEL_MODE: shadow
  BEC_LLM_MODE: 'off'
  BEC_LLM_MAX_CALLS_PER_TENANT_PER_DAY: '1000'
  BEC_HISTORY_DEFAULT_RETENTION_DAYS: '365'
  BEC_HISTORY_MAX_RETENTION_DAYS: '730'
  BEC_SUPPRESSIONS_MAX_PER_TENANT: '200'
  BEC_SUPPRESSION_MAX_WEIGHT: '40'
  BEC_MAX_EXECUTIVES: '500'
  BEC_MAX_VENDORS: '2000'
  BEC_MAX_TRUSTED_SENDERS: '1000'
  # Data loss prevention (step 4.5 §5, D18, D21; docs/deployment/dlp.md). Platform settings and
  # tenant bounds read by both the api (/api/v1/dlp/*, /api/v1/scan-settings/dlp) and
  # email-worker-dlp; they must agree. The engine-only keys are set in email-worker-dlp.yaml; the
  # evidence key (DLP_EVIDENCE_KEY / _PREVIOUS) is the Secret email-gateway-dlp-evidence-key,
  # mounted only in email-worker-dlp and the api.
  DLP_CONFIDENCE_THRESHOLD: '0.6'
  DLP_CONTEXT_WINDOW_CHARS: '64'
  DLP_BULK_MIN_DISTINCT: '5'
  DLP_DEFAULT_POLICY: alert
  DLP_CUSTOM_PATTERN_MAX_LENGTH: '256'
  DLP_CUSTOM_PATTERN_PROBE_MAX_MS: '50'
  DLP_CUSTOM_SCAN_MAX_CHARS: '1000000'
  DLP_CUSTOM_PATTERNS_MAX_PER_TENANT: '50'
  DLP_DICTIONARIES_MAX_PER_TENANT: '20'
  DLP_DICTIONARY_MAX_TERMS: '1000'
  DLP_POLICIES_MAX_PER_TENANT: '20'
  DLP_RULES_MAX_PER_POLICY: '50'
  DLP_EXCEPTIONS_MAX_PER_TENANT: '500'
  DLP_EXCEPTION_MAX_DAYS: '365'
  DLP_EVIDENCE_ENABLED: 'true'
  DLP_EVIDENCE_DEFAULT_RETENTION_DAYS: '30'
  DLP_EVIDENCE_MAX_RETENTION_DAYS: '180'
  # Sandbox (step 4.6 §5, X12, X17; docs/deployment/sandbox.md). Platform settings and tenant
  # bounds read by both the api (/api/v1/scan-settings/sandbox) and email-worker-sandbox; they must
  # agree. SANDBOX_EXPECTED_BACKEND only tells the api/portal what the controller runs (execution
  # is disabled: `disabled`; `static` = static analysis only); it enables nothing. The
  # sandbox-controller does NOT read this ConfigMap (it refuses S3_* and other keys) and the
  # sample/result keys are the Secret email-gateway-sandbox-keys.
  SANDBOX_TENANT_DEFAULT_ENABLED: 'false'
  SANDBOX_FILE_TYPES: pdf,ooxml_word,ooxml_excel,ooxml_powerpoint,ooxml_macro,ole_office,rtf,pe_executable,msi,elf,lnk,script_js,script_vbs,script_ps1,script_batch,script_shell,hta,html,svg
  SANDBOX_MAX_SAMPLE_BYTES: '26214400'
  SANDBOX_BROWSER_ANALYSIS: 'true'
  SANDBOX_EXPECTED_BACKEND: disabled
  SANDBOX_S3_BUCKET: replace-per-environment-sandbox
  SANDBOX_MAX_ARTIFACTS: '16'
  SANDBOX_MAX_ARTIFACT_BYTES: '2097152'
  SANDBOX_MAX_TOTAL_ARTIFACT_BYTES: '8388608'
  SANDBOX_ARTIFACT_RETENTION_DAYS: '30'
  SANDBOX_ANALYSIS_RETENTION_DAYS: '180'
  SANDBOX_SAMPLE_RETENTION_HOURS: '24'
  # click-service (U14). CLICK_TRUST_PROXY = reverse-proxy hops in front of the pods (ingress
  # controller; add one per CDN/WAF layer).
  CLICK_DB_TX_TIMEOUT_MS: '120000'
  CLICK_RATE_LIMIT_IP_PER_MINUTE: '120'
  CLICK_RATE_LIMIT_TOKEN_PER_MINUTE: '30'
  CLICK_RATE_LIMIT_INVALID_PER_MINUTE: '20'
  CLICK_RECHECK_BUDGET_MS: '2500'
  CLICK_EVENT_WRITE_WAIT_MS: '300'
  CLICK_EVENT_MAX_PENDING: '1000'
  CLICK_CONTINUE_TTL_SECONDS: '600'
  CLICK_TRUST_PROXY: '1'
  CLICK_STORE_CLIENT_NETWORK: 'true'
