# ATO responses and jobs (step 8.4 D3, D13, D15, D16, D22; docs/deployment/account-takeover.md):
# the ato-worker image with ATO_WORKER_ROLES=respond,maintenance,provider. respond: consumes
# ato.responses (provider actions through the ProviderRegistry; empty in 8.4: every provider action
# is `unsupported` until step 8.5 binds adapters). maintenance: leader-elected jobs
# (GET_LOCK('eg:ato:<job>')): ato.mail catch-up, decay, baselines, approval and restriction expiry,
# provider confirmations, digests, retention, account retirement, status gauges and the
# capabilities row. provider: the ingestion runner (idle without adapters). One replica (the jobs
# are leader-elected; a second replica would only wait for the locks). Writer-only MySQL, Redis,
# RabbitMQ; no object storage, no Internet egress (step 8.5 adds the provider endpoints).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ato-respond
  labels: { app.kubernetes.io/name: ato-respond, app.kubernetes.io/part-of: email-gateway }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: ato-respond }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ato-respond, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: ato-respond
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ato-respond
          image: email-gateway/ato-worker:latest
          ports:
            - { name: http, containerPort: 3085 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: HTTP_PORT, value: '3085' }
            - { name: ATO_WORKER_ROLES, value: 'respond,maintenance,provider' }
            - { name: ATO_RESPONSES_PREFETCH, value: '4' }
            - { name: ATO_TX_TIMEOUT_MS, value: '120000' }
            - { name: ATO_SETTINGS_CACHE_SECONDS, value: '30' }
            - { name: ATO_AUTOMATED_RESPONSES_ENABLED, value: 'true' }
            - { name: ATO_MAX_AUTOMATED_RESPONSES_PER_ORG_PER_HOUR, value: '10' }
            - { name: ATO_MAX_ACTIVE_RESTRICTIONS_PER_ORG, value: '500' }
            - { name: ATO_APPROVAL_TTL_HOURS, value: '24' }
            - { name: ATO_DECAY_SWEEP_INTERVAL_SECONDS, value: '900' }
            - { name: ATO_BASELINE_REBUILD_HOUR_UTC, value: '2' }
            - { name: ATO_BASELINE_BATCH, value: '500' }
            - { name: ATO_MAINTENANCE_INTERVAL_SECONDS, value: '60' }
            - { name: ATO_RETENTION_INCIDENT_DAYS, value: '730' }
            - { name: ATO_MAIL_CATCHUP_INTERVAL_SECONDS, value: '600' }
            - { name: ATO_MAIL_CATCHUP_LAG_SECONDS, value: '900' }
            - { name: ATO_MAIL_CATCHUP_BATCH, value: '1000' }
            - { name: ATO_MAIL_CATCHUP_MAX_AGE_HOURS, value: '24' }
            # The fake adapter is refused outside local/ci; production registers none in 8.4.
            - { name: ATO_PROVIDER_FAKE_ENABLED, value: 'false' }
            - { name: ATO_PROVIDER_POLL_INTERVAL_SECONDS, value: '60' }
            - { name: ATO_PROVIDER_MAX_PAGES_PER_POLL, value: '10' }
            - { name: ATO_PROVIDER_MAX_CONSECUTIVE_FAILURES, value: '10' }
            - { name: ATO_DIGEST_ENABLED, value: 'true' }
            - { name: ATO_GEOIP_MAX_AGE_DAYS, value: '35' }
            - { name: DATABASE_URL_FILE, value: /var/run/secrets/gateway/database-url }
            - { name: REDIS_URL_FILE, value: /var/run/secrets/gateway/redis-url }
            - { name: RABBITMQ_ATO_URL_FILE, value: /var/run/secrets/gateway/rabbitmq-ato-url }
            - { name: ATO_HMAC_KEY_FILE, value: /var/run/secrets/ato-key/hmac-key }
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
            - { name: ato-key, mountPath: /var/run/secrets/ato-key, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          # Readiness: mysql, redis and rabbitmq (ato.responses verified passively).
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret: { secretName: email-gateway-secrets }
        - name: ato-key
          secret:
            secretName: email-gateway-ato-key
            items: [{ key: hmac-key, path: hmac-key }]
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ato-respond
---
apiVersion: v1
kind: Service
metadata:
  name: ato-respond
  labels: { app.kubernetes.io/name: ato-respond }
spec:
  selector: { app.kubernetes.io/name: ato-respond }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Egress: MySQL, Redis, RabbitMQ, DNS and OTLP only. No object storage, no Internet egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ato-respond
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ato-respond }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ protocol: TCP, port: 3085 }]
  egress:
    - to: [{ ipBlock: { cidr: 10.0.32.0/20 } }]
      ports: [{ protocol: TCP, port: 3306 }]
    - to: [{ ipBlock: { cidr: 10.0.48.0/20 } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ ipBlock: { cidr: 10.0.64.0/20 } }]
      ports: [{ protocol: TCP, port: 5671 }, { protocol: TCP, port: 5672 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports: [{ protocol: TCP, port: 4318 }]
