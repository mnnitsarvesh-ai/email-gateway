# Daily partition maintenance (docs/database/partitioning.md, D3): splits pmax into dated
# partitions 3 months (7 days for the outbox) ahead, drops partitions past platform retention
# and runs the batched retention purges. Idempotent. Runs as the migrator (DDL) account.
# A failed run (including an expired outbox partition kept back by its guard, or partition DDL
# that waited longer than lock_wait_timeout = 5 s for a metadata lock) exits non-zero; alert on
# failed Jobs of this CronJob. concurrencyPolicy only covers this CronJob: the CLI also takes a
# per-schema MySQL advisory lock, so a db-migrate or manual run at the same time is skipped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-maintenance
  labels: { app.kubernetes.io/name: db-maintenance, app.kubernetes.io/part-of: email-gateway }
spec:
  schedule: '30 1 * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            { app.kubernetes.io/name: db-maintenance, app.kubernetes.io/part-of: email-gateway }
        spec:
          serviceAccountName: db-maintenance
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: db-maintenance
              image: email-gateway/db-migrate:latest
              command: ['node', 'dist/partitioning/cli.js', 'apply']
              envFrom:
                - configMapRef: { name: email-gateway-config }
              env:
                # Secrets are mounted as files by External Secrets and read via the <KEY>_FILE convention.
                - name: MIGRATION_DATABASE_URL_FILE
                  value: /var/run/secrets/gateway/migration-database-url
              volumeMounts:
                - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          volumes:
            - name: secrets
              secret: { secretName: email-gateway-secrets }
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-maintenance
automountServiceAccountToken: false
