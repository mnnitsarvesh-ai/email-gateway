# The data loss prevention engine (step 4.5 D1, D4, D16, D24; docs/plan/steps/13-dlp.md,
# docs/deployment/dlp.md): the scan role of the email-worker image with only the dlp consumer
# (scan.dlp, a stage-1 work queue: parsed.v1 and rescan_requested.v1) plus the evidence retention
# sweeper (one leader through the MySQL advisory lock scan:dlp-evidence), as role user eg-scanner.
# It reads the stored text/HTML bodies and attachment parts (S3), extracts attachment text in two
# resource-limited extractor children (the generalized 4.2 child pool: prlimit, empty
# environment, private 0700 directory under the size-limited emptyDir /tmp, Node's permission
# model, pdfjs with evaluation disabled), evaluates the tenant's DLP policies and writes sealed
# evidence objects (org/<org>/dlp-evidence/…) to the mail bucket. It is the ONLY email-worker
# Deployment that holds the evidence key-encryption key.
#
# Keys this Deployment needs:
#   From config.yaml `email-gateway-config` (platform-wide; the api reads the same bound keys):
#     SCAN_ENGINES (must contain dlp after phase 1 of the rollout; identical on every scan
#     replica), DLP_CONFIDENCE_THRESHOLD, DLP_CONTEXT_WINDOW_CHARS, DLP_BULK_MIN_DISTINCT,
#     DLP_DEFAULT_POLICY, DLP_CUSTOM_*, DLP_DICTIONAR*, DLP_POLICIES_MAX_PER_TENANT,
#     DLP_RULES_MAX_PER_POLICY, DLP_EXCEPTION*, DLP_EVIDENCE_ENABLED, DLP_EVIDENCE_*_RETENTION_DAYS,
#     the ATTACHMENT_ARCHIVE_* / ATTACHMENT_MAX_* walker limits, NODE_ENV=production.
#   Set below (engine budgets and per-replica bounds): SCAN_CONSUMERS=dlp,
#     MIME_INGESTION_ENABLED=false, SCAN_DLP_*, DLP_EXTRACTOR_* (RLIMITS=required), DLP_EXTRACT_*,
#     DLP_MAX_ATTACHMENTS, DLP_ATTACHMENT_MAX_BYTES, DLP_BYTE_BUDGET_BYTES, DLP_PDF_MAX_PAGES,
#     DLP_BODY_MAX_BYTES, DLP_TEXT_MAX_CHARS_*, DLP_DETECT_TIMEOUT_MS, DLP_SCAN_CHUNK_CHARS,
#     DLP_MAX_MATCHES_PER_DETECTOR, DLP_MAX_FINDINGS, DLP_EVIDENCE_MAX_BYTES,
#     DLP_EVIDENCE_MAX_MATCHES, DLP_EVIDENCE_SWEEP_INTERVAL_MS, DLP_TENANT_DATA_CACHE_TTL_MS.
#   Secrets (External Secrets): DLP_EVIDENCE_KEY (file, key `key`, 64 hex = 32 random bytes) and
#     DLP_EVIDENCE_KEY_PREVIOUS (optional env, key `previous-key`, rotation) from
#     email-gateway-dlp-evidence-key — mounted only here and in the api; DATABASE_URL,
#     RABBITMQ_SCANNER_URL, REDIS_URL and the S3 credentials from email-gateway-secrets.
#
# Memory sizing (docs/deployment/dlp.md): the worker process (V8 heap of the scan role, the
# tenant data LRU of ≤ 1 000 organizations, SCAN_DLP_CONCURRENCY messages of at most
# DLP_TEXT_MAX_CHARS_PER_MESSAGE UTF-16 units of text each, the DLP_BYTE_BUDGET_BYTES = 64 MiB
# attachment buffers) ≈ 600 MiB, plus 2 extractor children × DLP_EXTRACT_MAX_RSS_MB (512 MiB,
# killed above) = 1 GiB: limit 2 GiB, request 1.25 GiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-worker-dlp
  labels:
    {
      app.kubernetes.io/name: email-worker-dlp,
      app.kubernetes.io/component: scan-dlp,
      app.kubernetes.io/part-of: email-gateway,
    }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: email-worker-dlp }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {
          app.kubernetes.io/name: email-worker-dlp,
          app.kubernetes.io/component: scan-dlp,
          app.kubernetes.io/part-of: email-gateway,
        }
    spec:
      serviceAccountName: email-worker-dlp
      automountServiceAccountToken: false
      # In-flight scans are not awaited (held retries are requeued); the extractor children are
      # killed after the consumer stopped; the evidence sweeper stops with the consumer.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: email-worker-dlp }
      containers:
        - name: email-worker
          image: email-gateway/email-worker:latest
          ports:
            - { name: http, containerPort: 3020 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: HTTP_PORT, value: '3020' }
            - { name: APP_ENV, value: production }
            - { name: MIME_INGESTION_ENABLED, value: 'false' }
            - { name: SCAN_ENABLED, value: 'true' }
            - { name: SCAN_CONSUMERS, value: dlp }
            # The engine's budgets (D1 deadline rule): B(dlp) = 3 x (120 + 60) s = 540 s, below
            # B(url): the stage-1 maximum and SCAN_ROUND_DEADLINE_SECONDS are unchanged.
            - { name: SCAN_DLP_CONCURRENCY, value: '4' }
            - { name: SCAN_DLP_TIMEOUT_MS, value: '120000' }
            - { name: SCAN_DLP_MAX_ATTEMPTS, value: '3' }
            - { name: SCAN_RETRY_BASE_MS, value: '2000' }
            - { name: SCAN_RETRY_MAX_MS, value: '60000' }
            - { name: SCAN_S3_TIMEOUT_MS, value: '30000' }
            - { name: SCAN_DB_TIMEOUT_MS, value: '120000' }
            - { name: SCAN_ROUND_DEADLINE_SECONDS, value: '1800' }
            - { name: SCAN_SETTINGS_CACHE_TTL_MS, value: '30000' }
            - { name: SCAN_BREAKER_FAILURE_THRESHOLD, value: '5' }
            - { name: SCAN_BREAKER_FAILURE_RATIO, value: '0.5' }
            - { name: SCAN_BREAKER_WINDOW, value: '20' }
            - { name: SCAN_BREAKER_OPEN_MS, value: '15000' }
            - { name: SCAN_BREAKER_HALF_OPEN_PROBES, value: '1' }
            # Extractor pool (D4): two children, each killed above 10 s CPU / 512 MiB RSS.
            - { name: DLP_EXTRACTOR_POOL_SIZE, value: '2' }
            - { name: DLP_EXTRACTOR_MAX_JOBS, value: '200' }
            - { name: DLP_EXTRACTOR_HEAP_MB, value: '256' }
            - { name: DLP_EXTRACTOR_RLIMITS, value: required }
            - { name: ATTACHMENT_INSPECTOR_TMPDIR, value: /tmp }
            - { name: DLP_EXTRACT_TIMEOUT_MS, value: '20000' }
            - { name: DLP_EXTRACT_CPU_SECONDS, value: '10' }
            - { name: DLP_EXTRACT_MAX_RSS_MB, value: '512' }
            # Attachment and text bounds (D4).
            - { name: DLP_MAX_ATTACHMENTS, value: '50' }
            - { name: DLP_ATTACHMENT_MAX_BYTES, value: '26214400' }
            - { name: DLP_BYTE_BUDGET_BYTES, value: '67108864' }
            - { name: DLP_PDF_MAX_PAGES, value: '200' }
            - { name: DLP_BODY_MAX_BYTES, value: '4194304' }
            - { name: DLP_TEXT_MAX_CHARS_PER_PART, value: '1000000' }
            - { name: DLP_TEXT_MAX_CHARS_PER_MESSAGE, value: '4000000' }
            # Detection (D3 step 5, D7).
            - { name: DLP_DETECT_TIMEOUT_MS, value: '15000' }
            - { name: DLP_SCAN_CHUNK_CHARS, value: '65536' }
            - { name: DLP_MAX_MATCHES_PER_DETECTOR, value: '1000' }
            - { name: DLP_MAX_FINDINGS, value: '64' }
            # Evidence (D16) and tenant data cache (D3 step 3).
            - { name: DLP_EVIDENCE_MAX_BYTES, value: '32768' }
            - { name: DLP_EVIDENCE_MAX_MATCHES, value: '50' }
            - { name: DLP_EVIDENCE_SWEEP_INTERVAL_MS, value: '3600000' }
            - { name: DLP_TENANT_DATA_CACHE_TTL_MS, value: '30000' }
            # Secrets are mounted as files by External Secrets and read via the <KEY>_FILE convention.
            - { name: DATABASE_URL_FILE, value: /var/run/secrets/gateway/database-url }
            - {
                name: RABBITMQ_SCANNER_URL_FILE,
                value: /var/run/secrets/gateway/rabbitmq-scanner-url,
              }
            - { name: REDIS_URL_FILE, value: /var/run/secrets/gateway/redis-url }
            # The evidence key-encryption key (D16): its own Secret, mounted only here and in the
            # api. The previous key (rotation) is optional: an env reference with optional,
            # because a *_FILE path that does not exist is refused at start.
            - { name: DLP_EVIDENCE_KEY_FILE, value: /var/run/secrets/dlp-evidence/key }
            - name: DLP_EVIDENCE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  { name: email-gateway-dlp-evidence-key, key: previous-key, optional: true }
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
            - { name: dlp-evidence-key, mountPath: /var/run/secrets/dlp-evidence, readOnly: true }
            # Private 0700 directories of the extractor children only (they write nothing).
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            # Includes `dlp-engine` (versions, evidence mode) and `dlp-extractor` (at least one
            # child ready, rlimit and permission mode).
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: '1', memory: 1280Mi }
            limits: { cpu: '2', memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret: { secretName: email-gateway-secrets }
        - name: dlp-evidence-key
          secret:
            secretName: email-gateway-dlp-evidence-key
            items: [{ key: key, path: key }]
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: email-worker-dlp
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: email-worker-dlp
  labels: { app.kubernetes.io/name: email-worker-dlp }
spec:
  selector: { app.kubernetes.io/name: email-worker-dlp }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# CPU-based base HPA. Production adds the queue signal with KEDA (docs/deployment/dlp.md): a
# ScaledObject on rabbitmq_queue_messages_ready of scan.dlp (vhost email-gateway), target 100
# ready messages per replica, replacing this HPA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: email-worker-dlp
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: email-worker-dlp }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: email-worker-dlp
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: email-worker-dlp }
---
# Egress of the dlp engine (D24: no new egress). Internal data stores by subnet (replace the
# CIDRs per environment, as email-worker-bec.yaml), cluster DNS, OTLP, and TCP 443 to public
# addresses for the S3 endpoint only (when no VPC endpoint is used; replace it with the S3
# endpoint where the cluster has FQDN-aware egress). The extractor children have no network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: email-worker-dlp
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: email-worker-dlp }
  policyTypes: [Ingress, Egress]
  ingress:
    # Metrics and probes only (Prometheus; the kubelet's probes are not subject to policies).
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ protocol: TCP, port: 3020 }]
  egress:
    # MySQL writer (RDS/Aurora subnet).
    - to: [{ ipBlock: { cidr: 10.0.32.0/20 } }]
      ports: [{ protocol: TCP, port: 3306 }]
    # Redis (ElastiCache subnet): the worker's readiness dependency.
    - to: [{ ipBlock: { cidr: 10.0.48.0/20 } }]
      ports: [{ protocol: TCP, port: 6379 }]
    # RabbitMQ (Amazon MQ subnet).
    - to: [{ ipBlock: { cidr: 10.0.64.0/20 } }]
      ports: [{ protocol: TCP, port: 5671 }, { protocol: TCP, port: 5672 }]
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    # OTLP traces / logs to the collector.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports: [{ protocol: TCP, port: 4318 }]
    # S3 (public endpoint): HTTPS to public addresses only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports: [{ protocol: TCP, port: 443 }]
