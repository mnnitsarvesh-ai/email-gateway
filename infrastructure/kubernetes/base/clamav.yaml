# clamd + freshclam (step 4.2 A7, A20; docs/deployment/attachment-scanning.md): the attachment
# engine's antivirus, reached over TCP INSTREAM through the `clamav` Service (no local socket, no
# shared volume, no attachment ever written to disk by the worker). One pod runs clamd and
# freshclam (the image's entrypoint starts both); its signature database lives in an emptyDir and
# is downloaded at start (a private mirror or a pre-seeded database volume is recommended per
# environment, see the deployment doc). Production uses ConcurrentDatabaseReload yes, so a
# database reload never blocks scans; the pod is sized for two engines in memory during a reload
# (requests 1.5 GiB, limit 3 GiB). Scale on CPU with
# CLAMAV_MAX_CONNECTIONS x email-worker-attachment replicas <= MaxThreads x clamd replicas.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-config
  labels: { app.kubernetes.io/name: clamav, app.kubernetes.io/part-of: email-gateway }
data:
  clamd.conf: |
    # Production clamd (step 4.2 A7). Limits as infrastructure/clamav/clamd.conf (local), with
    # concurrent reloads and more threads per pod.
    LogTime yes
    LogFile /dev/stdout
    Foreground yes
    User clamav
    LocalSocket /tmp/clamd.sock
    TCPSocket 3310
    TCPAddr 0.0.0.0
    MaxThreads 8
    MaxQueue 64
    StreamMaxLength 30M
    MaxScanSize 150M
    MaxFileSize 30M
    MaxRecursion 10
    MaxFiles 2000
    AlertExceedsMax yes
    AlertOLE2Macros yes
    AlertEncrypted no
    HeuristicScanPrecedence no
    ConcurrentDatabaseReload yes
    SelfCheck 600
  freshclam.conf: |
    DatabaseDirectory /var/lib/clamav
    UpdateLogFile /dev/stdout
    LogTime yes
    DatabaseOwner clamav
    # Point at the environment's private mirror (recommended) or the public CDN.
    DatabaseMirror database.clamav.net
    Checks 24
    NotifyClamd /etc/clamav/clamd.conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  labels:
    {
      app.kubernetes.io/name: clamav,
      app.kubernetes.io/component: antivirus,
      app.kubernetes.io/part-of: email-gateway,
    }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {
          app.kubernetes.io/name: clamav,
          app.kubernetes.io/component: antivirus,
          app.kubernetes.io/part-of: email-gateway,
        }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # The image's entrypoint drops to the clamav user (uid 100) for clamd and freshclam.
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: clamav }
      containers:
        - name: clamav
          # Pinned per environment by digest (the 1.4 line is the one the step verified).
          image: clamav/clamav-debian:1.4
          ports:
            - { name: clamd, containerPort: 3310 }
          env:
            - { name: CLAMAV_NO_MILTERD, value: 'true' }
          volumeMounts:
            - {
                name: config,
                mountPath: /etc/clamav/clamd.conf,
                subPath: clamd.conf,
                readOnly: true,
              }
            - {
                name: config,
                mountPath: /etc/clamav/freshclam.conf,
                subPath: freshclam.conf,
                readOnly: true,
              }
            - { name: db, mountPath: /var/lib/clamav }
            - { name: run, mountPath: /run/clamav }
            - { name: tmp, mountPath: /tmp }
            - { name: log, mountPath: /var/log/clamav }
          # Ready once clamd answers PING (the engine's `clamav` readiness check uses the same).
          readinessProbe:
            exec: { command: ['clamdcheck.sh'] }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec: { command: ['clamdcheck.sh'] }
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          # The first database download and load can take several minutes.
          startupProbe:
            exec: { command: ['clamdcheck.sh'] }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          resources:
            requests: { cpu: '1', memory: 1536Mi }
            limits: { memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER] }
      volumes:
        - name: config
          configMap: { name: clamav-config }
        - name: db
          emptyDir: { sizeLimit: 2Gi }
        - name: run
          emptyDir: { sizeLimit: 16Mi }
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: log
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  labels: { app.kubernetes.io/name: clamav }
spec:
  selector: { app.kubernetes.io/name: clamav }
  ports:
    - { name: clamd, port: 3310, targetPort: clamd }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clamav
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: clamav }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clamav
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
