apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: email-gateway }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: api }
      containers:
        - name: api
          image: email-gateway/api:latest
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: HTTP_PORT, value: '3000' }
            # Secrets are mounted as files by External Secrets and read via the <KEY>_FILE convention.
            - { name: DATABASE_URL_FILE, value: /var/run/secrets/gateway/database-url }
            # Control-plane reads: RDS/Aurora reader endpoint (see docs/database/replication.md).
            - { name: DATABASE_READ_URL_FILE, value: /var/run/secrets/gateway/database-read-url }
            # Role user eg-ops (step 3.2 Q9, Q10): dead-letter replay and queue stats.
            - { name: RABBITMQ_OPS_URL_FILE, value: /var/run/secrets/gateway/rabbitmq-ops-url }
            - { name: DEAD_LETTER_REPLAY_SCAN_MAX, value: '10000' }
            # Risk scoring (step 5.1 R15, R16): platform profile of the profile and dry-run
            # routes, profile versions per organization.
            - { name: RISK_PLATFORM_PROFILE, value: rsk-default/1 }
            - { name: RISK_PROFILE_MAX_VERSIONS, value: '200' }
            # Policy management bounds (step 5.2 §5, P17, P22); POLICY_PLATFORM_DEFAULT: ConfigMap.
            - { name: POLICY_MAX_POLICIES, value: '100' }
            - { name: POLICY_MAX_VERSIONS_PER_POLICY, value: '200' }
            - { name: POLICY_MAX_ACTIVE_RULES, value: '1000' }
            - { name: POLICY_HISTORY_MAX_RANGE_DAYS, value: '31' }
            - { name: DEPARTMENT_MAX_PER_ORG, value: '500' }
            - { name: DEPARTMENT_MAX_MEMBERS, value: '5000' }
            # Quarantine (step 5.3 §5); shared bounds come from the ConfigMap.
            - { name: QUARANTINE_TX_TIMEOUT_MS, value: '120000' }
            - { name: QUARANTINE_MANUAL_FROM_REJECT_MAX_DAYS, value: '30' }
            - { name: QUARANTINE_SEARCH_MAX_RANGE_DAYS, value: '62' }
            - { name: QUARANTINE_SEARCH_MAX_PAGE_SIZE, value: '100' }
            - { name: QUARANTINE_PREVIEW_MAX_BODY_BYTES, value: '262144' }
            - { name: QUARANTINE_PREVIEW_MAX_TEXT_CHARS, value: '100000' }
            - { name: QUARANTINE_PREVIEW_RATE_PER_MINUTE, value: '60' }
            - { name: QUARANTINE_DOWNLOAD_TOKEN_TTL_SECONDS, value: '60' }
            - { name: QUARANTINE_DOWNLOAD_MAX_BYTES, value: '26214400' }
            - { name: QUARANTINE_DOWNLOAD_GRANTS_PER_HOUR, value: '20' }
            - { name: QUARANTINE_BULK_MAX_ITEMS, value: '100' }
            - { name: QUARANTINE_BULK_MAX_ITEMS_PER_MINUTE, value: '1000' }
            - { name: QUARANTINE_BULK_REQUESTS_PER_MINUTE, value: '20' }
            - { name: QUARANTINE_BULK_DEADLINE_MS, value: '25000' }
            # Quarantine download tokens (step 5.3 Q12, Q28): the api is the only holder of the
            # HMAC key; its own Secret, mounted here only (64 hex characters).
            - {
                name: QUARANTINE_DOWNLOAD_TOKEN_KEY_FILE,
                value: /var/run/secrets/quarantine-download/key,
              }
            # REST API conventions (step 6.1 §3.7, ADR-0050..0053): global limiter (per principal,
            # per tenant clamped, sensitive/expensive classes; Redis, fail closed), Idempotency-Key
            # reservations, v1 list bounds, reports and the manual suppression cap.
            - { name: API_CURSOR_TTL_SECONDS, value: '86400' }
            - { name: API_RATE_PRINCIPAL_PER_MINUTE, value: '600' }
            - { name: API_RATE_TENANT_DEFAULT_PER_MINUTE, value: '300' }
            - { name: API_RATE_TENANT_MIN_PER_MINUTE, value: '10' }
            - { name: API_RATE_TENANT_MAX_PER_MINUTE, value: '10000' }
            - { name: API_RATE_SENSITIVE_PER_MINUTE, value: '30' }
            - { name: API_RATE_EXPENSIVE_PER_MINUTE, value: '20' }
            - { name: API_RATE_LIMIT_CACHE_SECONDS, value: '60' }
            - { name: API_IDEMPOTENCY_LEGACY_MODE, value: enforce }
            - { name: API_IDEMPOTENCY_PENDING_TTL_SECONDS, value: '300' }
            - { name: API_LIST_SCAN_BUDGET_ROWS, value: '5000' }
            - { name: API_MESSAGES_MAX_RANGE_DAYS, value: '31' }
            - { name: API_AUDIT_MAX_RANGE_DAYS, value: '90' }
            - { name: REPORTS_MAX_RANGE_DAYS, value: '31' }
            - { name: REPORTS_CACHE_TTL_SECONDS, value: '60' }
            - { name: REPORTS_QUERY_TIMEOUT_MS, value: '10000' }
            - { name: RECIPIENT_SUPPRESSIONS_MAX_MANUAL, value: '100000' }
            # HMAC key of the signed v1 list cursors (step 6.1 D3; 64 hex characters): the api is
            # its only holder; its own Secret, mounted here only. The previous key (rotation,
            # verification only) is optional; see docs/runbooks/api-rate-limits-and-reports.md.
            - { name: API_CURSOR_KEY_FILE, value: /var/run/secrets/api-cursor/key }
            - name: API_CURSOR_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  { name: email-gateway-api-cursor-key, key: previous-key, optional: true }
            - { name: REDIS_URL_FILE, value: /var/run/secrets/gateway/redis-url }
            # Authentication (steps 1.2/1.3) and the transactional-email relay password.
            - { name: AUTH_JWT_SECRET_FILE, value: /var/run/secrets/gateway/auth-jwt-secret }
            - { name: AUTH_TOKEN_PEPPER_FILE, value: /var/run/secrets/gateway/auth-token-pepper }
            - {
                name: DATA_ENCRYPTION_KEY_FILE,
                value: /var/run/secrets/gateway/data-encryption-key,
              }
            - {
                name: NOTIFY_SMTP_PASSWORD_FILE,
                value: /var/run/secrets/gateway/notify-smtp-password,
              }
            # DLP evidence (step 4.5 D16, D24): the key-encryption key opens evidence in the
            # audited GET .../dlp-evidence route only. Its own Secret, mounted here and in
            # email-worker-dlp only. The previous key (rotation) is optional.
            - { name: DLP_EVIDENCE_KEY_FILE, value: /var/run/secrets/dlp-evidence/key }
            - name: DLP_EVIDENCE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  { name: email-gateway-dlp-evidence-key, key: previous-key, optional: true }
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
            - { name: dlp-evidence-key, mountPath: /var/run/secrets/dlp-evidence, readOnly: true }
            - {
                name: quarantine-download-key,
                mountPath: /var/run/secrets/quarantine-download,
                readOnly: true,
              }
            - { name: api-cursor-key, mountPath: /var/run/secrets/api-cursor, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret: { secretName: email-gateway-secrets }
        - name: dlp-evidence-key
          secret:
            secretName: email-gateway-dlp-evidence-key
            items: [{ key: key, path: key }]
        - name: quarantine-download-key
          secret:
            secretName: email-gateway-quarantine-download-key
            items: [{ key: key, path: key }]
        - name: api-cursor-key
          secret:
            secretName: email-gateway-api-cursor-key
            items: [{ key: key, path: key }]
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Public/internal boundary (step 6.1 D13, ADR-0053): api.<domain> routes ONLY the Prefix /api/v1/
# to the api. The same port also serves /health/live, /health/ready (kubelet probes) and /metrics
# (Prometheus, in-cluster): they are never routed here, nor /docs (never served in production).
# nginx matches on the normalized URI, so /api/v1/../metrics does not reach the api as /metrics.
# TLS is terminated at the ingress controller (certificate per environment, e.g. cert-manager).
# Rate limiting is per principal and per tenant in the api (Redis); no per-IP ingress limit, since
# many API clients share NAT addresses. Request bodies are small JSON (the api's parser refuses
# larger ones with 413); proxy timeouts cover the longest synchronous transaction budget
# (QUARANTINE_TX_TIMEOUT_MS, 120 s) and the quarantine download stream.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '5'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '130'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.replace-per-environment.invalid]
      secretName: api-tls
  rules:
    - host: api.replace-per-environment.invalid
      http:
        paths:
          - path: /api/v1/
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
