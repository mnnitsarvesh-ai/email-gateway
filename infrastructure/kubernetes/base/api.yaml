apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: email-gateway }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: api }
      containers:
        - name: api
          image: email-gateway/api:latest
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: HTTP_PORT, value: '3000' }
            # Secrets are mounted as files by External Secrets and read via the <KEY>_FILE convention.
            - { name: DATABASE_URL_FILE, value: /var/run/secrets/gateway/database-url }
            # Control-plane reads: RDS/Aurora reader endpoint (see docs/database/replication.md).
            - { name: DATABASE_READ_URL_FILE, value: /var/run/secrets/gateway/database-read-url }
            # Role user eg-ops (step 3.2 Q9, Q10): dead-letter replay and queue stats.
            - { name: RABBITMQ_OPS_URL_FILE, value: /var/run/secrets/gateway/rabbitmq-ops-url }
            - { name: DEAD_LETTER_REPLAY_SCAN_MAX, value: '10000' }
            # Risk scoring (step 5.1 R15, R16): platform profile of the profile and dry-run
            # routes, profile versions per organization.
            - { name: RISK_PLATFORM_PROFILE, value: rsk-default/1 }
            - { name: RISK_PROFILE_MAX_VERSIONS, value: '200' }
            # Policy management bounds (step 5.2 §5, P17, P22); POLICY_PLATFORM_DEFAULT: ConfigMap.
            - { name: POLICY_MAX_POLICIES, value: '100' }
            - { name: POLICY_MAX_VERSIONS_PER_POLICY, value: '200' }
            - { name: POLICY_MAX_ACTIVE_RULES, value: '1000' }
            - { name: POLICY_HISTORY_MAX_RANGE_DAYS, value: '31' }
            - { name: DEPARTMENT_MAX_PER_ORG, value: '500' }
            - { name: DEPARTMENT_MAX_MEMBERS, value: '5000' }
            - { name: REDIS_URL_FILE, value: /var/run/secrets/gateway/redis-url }
            # Authentication (steps 1.2/1.3) and the transactional-email relay password.
            - { name: AUTH_JWT_SECRET_FILE, value: /var/run/secrets/gateway/auth-jwt-secret }
            - { name: AUTH_TOKEN_PEPPER_FILE, value: /var/run/secrets/gateway/auth-token-pepper }
            - {
                name: DATA_ENCRYPTION_KEY_FILE,
                value: /var/run/secrets/gateway/data-encryption-key,
              }
            - {
                name: NOTIFY_SMTP_PASSWORD_FILE,
                value: /var/run/secrets/gateway/notify-smtp-password,
              }
            # DLP evidence (step 4.5 D16, D24): the key-encryption key opens evidence in the
            # audited GET .../dlp-evidence route only. Its own Secret, mounted here and in
            # email-worker-dlp only. The previous key (rotation) is optional.
            - { name: DLP_EVIDENCE_KEY_FILE, value: /var/run/secrets/dlp-evidence/key }
            - name: DLP_EVIDENCE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  { name: email-gateway-dlp-evidence-key, key: previous-key, optional: true }
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/gateway, readOnly: true }
            - { name: dlp-evidence-key, mountPath: /var/run/secrets/dlp-evidence, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: secrets
          secret: { secretName: email-gateway-secrets }
        - name: dlp-evidence-key
          secret:
            secretName: email-gateway-dlp-evidence-key
            items: [{ key: key, path: key }]
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
