# Base manifests for the Node services. Stateful infrastructure (MySQL, RabbitMQ, Redis,
# OpenSearch, ClickHouse, S3) is managed by Terraform as AWS services, and Postfix runs on
# EC2 Auto Scaling Groups; neither is deployed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: email-gateway
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - smtp-adapter.yaml
  - email-worker.yaml
  # Attachment scanning (step 4.2 A20): the attachment consumer and clamd.
  - email-worker-attachment.yaml
  - clamav.yaml
  # URL protection (step 4.3 U19): the url engine, the time-of-click service, the egress proxy and
  # the isolated browser worker.
  - email-worker-url.yaml
  - click-service.yaml
  - url-egress-proxy.yaml
  - url-browser-worker.yaml
  - policy-engine.yaml
  - delivery-worker.yaml
  - notification-worker.yaml
  - archive-worker.yaml
  # Outbox relay and reconciliation (step 3.2, ADR-0023).
  - event-relay.yaml
  - admin-portal.yaml
  # Daily partition maintenance (CronJob, migrator account).
  - db-maintenance.yaml
