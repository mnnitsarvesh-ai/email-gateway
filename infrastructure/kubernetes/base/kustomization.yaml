# Base manifests for the Node services. Stateful infrastructure (MySQL, RabbitMQ, Redis,
# OpenSearch, ClickHouse, S3) is managed by Terraform as AWS services, and Postfix runs on
# EC2 Auto Scaling Groups; neither is deployed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: email-gateway
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - smtp-adapter.yaml
  - email-worker.yaml
  # Attachment scanning (step 4.2 A20): the attachment consumer and clamd.
  - email-worker-attachment.yaml
  - clamav.yaml
  # URL protection (step 4.3 U19): the url engine, the time-of-click service, the egress proxy and
  # the isolated browser worker.
  - email-worker-url.yaml
  - click-service.yaml
  - url-egress-proxy.yaml
  - url-browser-worker.yaml
  # Phishing and BEC detection (step 4.4 B1, B20): the stage-2 bec engine, the only holder of the
  # context HMAC key and the LLM API key.
  - email-worker-bec.yaml
  # Data loss prevention (step 4.5 D1, D24): the stage-1 dlp engine with its extractor children
  # and the evidence sweeper, the only email-worker Deployment holding the evidence key.
  - email-worker-dlp.yaml
  # Sandbox (step 4.6 X1, X13; docs/deployment/sandbox.md): the isolated sandbox-controller with
  # SANDBOX_BACKEND=disabled (execution of unknown files is disabled; the vm backend refuses to
  # start in 4.6) and the email-worker's asynchronous sandbox engine.
  - sandbox-controller.yaml
  - email-worker-sandbox.yaml
  - policy-engine.yaml
  # Quarantine (step 5.3 Q28): the policy-engine image with the quarantine role (release executor,
  # sweeper, digests); separate from the delivery gate.
  - quarantine-worker.yaml
  - delivery-worker.yaml
  - notification-worker.yaml
  # Webhooks (step 6.2 W1, ADR-0055; docs/deployment/webhooks.md): the webhook-worker image as two
  # Deployments: webhook-fanout (consumes email.webhooks) and webhook-delivery (signs and POSTs
  # through the SSRF-guarded client; the only workload with Internet egress on 443 for webhooks).
  - webhook-fanout.yaml
  - webhook-delivery.yaml
  - archive-worker.yaml
  # Outbox relay and reconciliation (step 3.2, ADR-0023).
  - event-relay.yaml
  - admin-portal.yaml
  # Daily partition maintenance (CronJob, migrator account).
  - db-maintenance.yaml
