apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  labels: { app.kubernetes.io/name: admin-portal, app.kubernetes.io/part-of: email-gateway }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: admin-portal }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: admin-portal, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: admin-portal
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: admin-portal }
      containers:
        - name: admin-portal
          image: email-gateway/admin-portal:latest
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: PORT, value: '3001' }
            # The portal holds no data-store credentials; it talks to the API only.
            - { name: API_INTERNAL_URL, value: http://api.email-gateway.svc.cluster.local }
            # PORTAL_PUBLIC_URL, NODE_ENV and APP_ENV come from the ConfigMap (envFrom above).
            # Step 7.1 §3.5: one proxy hop (the ingress controller) in front of the portal.
            - { name: PORTAL_TRUST_PROXY_HOPS, value: '1' }
            - { name: PORTAL_API_TIMEOUT_MS, value: '15000' }
            # Session sealing key (AES-256-GCM, 64 hex characters, step 7.1 P2): its own Secret,
            # mounted in the portal only; the previous key (rotation, unseal only) is optional.
            - { name: PORTAL_SESSION_KEY_FILE, value: /var/run/secrets/admin-portal-session/key }
            - name: PORTAL_SESSION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  { name: email-gateway-admin-portal-session, key: previous-key, optional: true }
            # Trusted client-IP forwarder (step 7.1 P5, ADR-0060): the secret shared with the api
            # only. Rotation: update the Secret, restart api and admin-portal.
            - {
                name: API_TRUSTED_FORWARDER_TOKEN_FILE,
                value: /var/run/secrets/api-trusted-forwarder/token,
              }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/apps/admin-portal/.next/cache }
            - {
                name: admin-portal-session,
                mountPath: /var/run/secrets/admin-portal-session,
                readOnly: true,
              }
            - {
                name: api-trusted-forwarder,
                mountPath: /var/run/secrets/api-trusted-forwarder,
                readOnly: true,
              }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: admin-portal-session
          secret:
            secretName: email-gateway-admin-portal-session
            items: [{ key: key, path: key }]
        - name: api-trusted-forwarder
          secret:
            secretName: email-gateway-api-trusted-forwarder
            items: [{ key: token, path: token }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-portal
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  labels: { app.kubernetes.io/name: admin-portal }
spec:
  selector: { app.kubernetes.io/name: admin-portal }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# The portal's public entry point (step 7.1, ADR-0060, superseding decision 4 of ADR-0053): its
# own host, distinct from the api host, `Prefix /` to the portal Service. The portal serves pages,
# its BFF under /bff/* (OpenAPI operations only) and its liveness probe /api/health; it never
# exposes the api's /metrics, /health or /docs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-portal
  labels: { app.kubernetes.io/name: admin-portal }
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '5'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [portal.replace-per-environment.invalid]
      secretName: admin-portal-tls
  rules:
    - host: portal.replace-per-environment.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-portal, port: { name: http } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-portal
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: admin-portal }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin-portal
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: admin-portal }
