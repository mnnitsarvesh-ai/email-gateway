apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  labels: { app.kubernetes.io/name: admin-portal, app.kubernetes.io/part-of: email-gateway }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: admin-portal }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: admin-portal, app.kubernetes.io/part-of: email-gateway }
    spec:
      serviceAccountName: admin-portal
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: admin-portal }
      containers:
        - name: admin-portal
          image: email-gateway/admin-portal:latest
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - configMapRef: { name: email-gateway-config }
          env:
            - { name: PORT, value: '3001' }
            # The portal holds no data-store credentials; it talks to the API only.
            - { name: API_INTERNAL_URL, value: http://api.email-gateway.svc.cluster.local }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/apps/admin-portal/.next/cache }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-portal
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  labels: { app.kubernetes.io/name: admin-portal }
spec:
  selector: { app.kubernetes.io/name: admin-portal }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-portal
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: admin-portal }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin-portal
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: admin-portal }
