# Fail closed (step 2.2 invariant 3, ADR-0020 decision 4): every message on the 10027
# reinject-outbound listener must leave DKIM-signed. The policy service already defers RCPT when
# redis-dkim has no selector for the sender domain; this rule closes the remaining window (key
# removed or redis-dkim restarted between RCPT and end of DATA, Redis error, From domain without
# a key) by tempfailing the message through the milter (4xx) instead of sending it unsigned.
# The delivery-worker retries; nothing is rejected permanently here.
rules {
  GATEWAY_DKIM_UNSIGNED {
    action = "soft reject";
    expression = "!DKIM_SIGNED";
    message = "Signing key not available, try again later";
  }
}
