# DKIM signing from redis-dkim (step 2.2 D12, ADR-0020). Static part; the entrypoint appends the
# Redis connection (servers, username, password) into the tmpfs copy of this file (mode 0600).
#
# Redis layout written by the api's DkimSigningPublisher:
#   hash dkim_selectors: field <domain>          -> <selector>
#   hash dkim_keys:      field <selector>.<domain> -> PKCS#8 PEM
# Rspamd 3.12 option names (verified in lua_dkim_tools.lua): selector_prefix = hash of
# selectors (HGET selector_prefix <domain>), key_prefix = hash of keys
# (HGET key_prefix <selector>.<domain>).
enabled = true;
use_redis = true;
selector_prefix = "dkim_selectors";
key_prefix = "dkim_keys";
# Sign with the domain of the From header; never when it differs from the envelope sender.
use_domain = "header";
allow_hdrfrom_mismatch = false;
allow_hdrfrom_multiple = false;
allow_username_mismatch = true;
# The milter is reachable only from postfix-outbound and only its 10027 listener uses it, so
# every client of this instance is a signing client. That reachability is the control: locally
# rspamd-outbound is attached only to the internal `dkim-signing` Compose network (shared with
# postfix-outbound and redis-dkim), in AWS the sg-rspamd-outbound security group admits 11332
# from sg-postfix-outbound only (docs/deployment/smtp-gateway.md). sign_networks cannot narrow
# it: Rspamd matches it against the client address the milter peer itself reports (Postfix's
# {client_addr} macro), which a rogue milter peer chooses freely.
sign_authenticated = true;
sign_local = true;
sign_inbound = false;
sign_networks = ["0.0.0.0/0", "::/0"];
# DEVIATION from D12 (try_fallback = false), verified against Rspamd 3.12 lua_dkim_tools.lua:
# with no static `domain {}` entries, try_fallback = false returns "dkim unconfigured" before
# Redis is ever consulted, so nothing would be signed. With use_redis = true the fallback entry
# only provides the From-header domain: the selector comes from HGET dkim_selectors <domain>, the
# key from HGET dkim_keys <selector>.<domain>, and the default key path is never used. A domain
# without both entries is not signed (and force_actions.conf then tempfails the message), so it
# can never be signed with another domain's key.
try_fallback = true;
# Never sign with the eSLD instead of the exact From domain.
use_esld = false;
check_pubkey = false;
allow_pubkey_mismatch = false;
