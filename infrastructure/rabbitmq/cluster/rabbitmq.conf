# TEST-ONLY 3-node cluster (Compose profile rabbitmq-cluster, step 3.2 §7) for the broker
# node-failure test: quorum queues replicate over rmq1..rmq3. Sized for the 8 GB development VM
# (mem_limit 448m per node). The topology is applied with init.mjs --mgmt-url (node 1).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rmq1
cluster_formation.classic_config.nodes.2 = rabbit@rmq2
cluster_formation.classic_config.nodes.3 = rabbit@rmq3
loopback_users.guest = true
default_vhost = /
consumer_timeout = 1800000
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 256MB
max_message_size = 1048576
