# Broker settings only. The topology (vhost email-gateway, exchanges, quorum queues, bindings,
# policies) comes from infrastructure/rabbitmq/definitions.json, generated from
# packages/event-contracts and imported by the rabbitmq-init one-shot (init.mjs, step 3.2 Q5);
# services never declare, they verify passively.
loopback_users.guest = true
default_vhost = /
consumer_timeout = 1800000
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
# Last line of defence behind the publishers' content guard (envelopes <= 128 KiB, step 3.2 Q7).
max_message_size = 1048576
