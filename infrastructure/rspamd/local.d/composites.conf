# Local composites (step 4.1 S7 R3, S12). policy = "leave" keeps the constituent symbols (and
# their scores) in the reply: the post-queue mapping and the SPF/DKIM/DMARC extraction read them.
EG_PHISH_AUTH_FAIL {
  expression = "PHISHING & (DMARC_POLICY_REJECT | DMARC_POLICY_QUARANTINE | R_SPF_FAIL)";
  policy = "leave";
  score = 4.0;
  group = "eg_local";
  description = "Link text/target mismatch combined with an SPF or DMARC failure";
}
# Header From display name carries an address of another domain (Rspamd's own
# FROM_NEQ_DISPLAY_NAME / SPOOF_DISPLAY_NAME detection; see docs/deployment/rspamd.md deviations).
EG_DISPLAY_NAME_ADDRESS {
  expression = "FROM_NEQ_DISPLAY_NAME | SPOOF_DISPLAY_NAME";
  policy = "leave";
  score = 3.0;
  group = "eg_local";
  description = "From display name contains an address whose domain differs from the From domain";
}
