# Scores of the gateway's own symbols (step 4.1 S12). Symbols of rendered rules (EG_TEST_RBL,
# EG_TEST_DBL, EG_BAD_URL, EG_FUZZY_*) are scored here so every profile scores them alike.
group "eg_local" {
  description = "Email Security Gateway local rules";
  symbols {
    EG_TEST_RBL {
      weight = 4.0;
      description = "Client IP listed in the local test RBL (rbl.scan.test)";
    }
    EG_TEST_DBL {
      weight = 6.5;
      description = "URL or address domain listed in the local test DBL (dbl.scan.test)";
    }
    EG_BAD_URL {
      weight = 10.0;
      description = "URL host listed in the gateway's known-bad URL map";
    }
    EG_FUZZY_SPAM {
      weight = 10.0;
      description = "Fuzzy hash added as spam by a platform administrator";
    }
    EG_FUZZY_PHISH {
      weight = 12.0;
      description = "Fuzzy hash added as phishing by a platform administrator";
    }
    # Reputation (reputation.conf). Rspamd registers these without scores; the module inserts a
    # multiplier in [-1, 1] (split symbols: _SPAM positive, _HAM negative). Conservative weights:
    # reputation learns from Rspamd's own verdicts (reject = spam, negative score = ham), so it
    # nudges scores (at most about +/-2.5 together) instead of deciding them.
    IP_REPUTATION_SPAM {
      weight = 1.0;
    }
    IP_REPUTATION_HAM {
      weight = -0.5;
    }
    SPF_REPUTATION_SPAM {
      weight = 0.5;
    }
    SPF_REPUTATION_HAM {
      weight = -0.25;
    }
    DKIM_REPUTATION {
      weight = 0.5;
    }
    SENDER_REP {
      weight = 0.5;
    }
    EG_FUZZY_UNKNOWN {
      weight = 0.0;
      description = "Fuzzy hash with an unknown flag in the local storage";
    }
  }
}
