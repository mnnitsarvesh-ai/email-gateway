# Settings selected per request by the post-queue scan with the Settings-Id header (step 4.1 S9).
# eg_inbound: Rspamd defaults. eg_outbound: mail from authenticated submitters of a tenant (the
# User header is set too): no HELO checks. IP blocklists already skip authenticated users
# (rbl exclude_users), domain/URL blocklists still run.
eg_inbound {
  id = "eg_inbound";
  apply {
  }
}
eg_outbound {
  id = "eg_outbound";
  apply {
    symbols_disabled = [
      "HFILTER_HELO_BADIP",
      "HFILTER_HELO_IP_A",
      "HFILTER_HELO_NOT_FQDN",
      "HFILTER_HELO_NORES_A_OR_MX",
      "HFILTER_HELO_BAREIP",
      "HFILTER_HELO_1",
      "HFILTER_HELO_2",
      "HFILTER_HELO_3",
      "HFILTER_HELO_4",
      "HFILTER_HELO_5"
    ];
  }
}
