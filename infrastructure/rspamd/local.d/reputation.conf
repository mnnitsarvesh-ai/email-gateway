# Sender reputation (step 4.1 S12): IP, SPF domain, DKIM domain and sender (From) domain buckets,
# stored in Redis (RSPAMD_REDIS_DB) with Rspamd's native bucketed TTLs.
rules {
  ip_reputation = {
    selector "ip" {
    }
    backend "redis" {
    }
    symbol = "IP_REPUTATION";
  }
  spf_reputation = {
    selector "spf" {
    }
    backend "redis" {
    }
    symbol = "SPF_REPUTATION";
  }
  dkim_reputation = {
    selector "dkim" {
      # Bounded like the weights in groups.conf (Rspamd default 2.0).
      max_accept_adjustment = 0.5;
    }
    backend "redis" {
    }
    symbol = "DKIM_REPUTATION";
  }
  generic_reputation = {
    selector "generic" {
      selector = "from('mime'):domain";
    }
    backend "redis" {
    }
    symbol = "SENDER_REP";
  }
}
