# Fuzzy hashes (step 4.1 S12, S13). override.d replaces the default `rule` set, so the public
# rspamd.com storage is NOT queried (it needs Internet access and shares hashes with a third
# party). Production may add it back here by configuration.
rule "eg_local" {
  algorithm = "mumhash";
  servers = "127.0.0.1:11335";
  symbol = "EG_FUZZY_UNKNOWN";
  mime_types = ["*"];
  max_score = 20.0;
  read_only = false;
  skip_unknown = true;
  short_text_direct_hash = true;
  min_length = 64;
  fuzzy_map = {
    EG_FUZZY_SPAM {
      max_score = 20.0;
      flag = 11;
    }
    EG_FUZZY_PHISH {
      max_score = 20.0;
      flag = 12;
    }
  }
}
