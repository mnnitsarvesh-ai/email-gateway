packages:
  - apps/*
  - packages/*
  - tests
  # Playwright end-to-end tests of the admin portal (step 7.1 WP6).
  - tests/portal-e2e
  # Generated attachment test files (step 4.2 §9), built like a package.
  - tests/fixtures/attachment-corpus

# Refuse packages published less than 7 days ago (supply-chain hygiene).
minimumReleaseAge: 10080

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
