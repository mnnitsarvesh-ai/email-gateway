name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, unit & e2e tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  migrations:
    name: Migrations apply cleanly and match the schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: email_gateway
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Throwaway CI database; not a secret.
      DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/email_gateway
      MIGRATION_DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/email_gateway
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # db:migrate builds the database package, runs the migration-history preflight
      # (dist/migrations/cli.js check), then prisma migrate deploy.
      - name: Apply migrations
        run: pnpm db:migrate
      # Partition maintenance as in Compose and the CronJob; the second run must be a no-op.
      - name: Partition maintenance
        working-directory: packages/database
        run: node dist/partitioning/cli.js apply && node dist/partitioning/cli.js apply
      # Prisma does not model partitions, so the drift check must stay clean after the split.
      - name: Fail if schema.prisma has changes without a migration
        working-directory: packages/database
        run: >-
          node node_modules/prisma/build/index.js migrate diff
          --from-url "$MIGRATION_DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - name: Seed catalog and demo data twice (idempotent)
        working-directory: packages/database
        env:
          APP_ENV: ci
          # Prints the row counts of the seeded tables; the second seed must not change them.
          COUNT: >-
            const {PrismaClient}=require('@prisma/client'); const p=new PrismaClient();
            const t=['permissions','roles','role_permissions','organization_plans','system_settings','organizations','users','user_roles','domains','email_policies','policy_versions'];
            Promise.all(t.map(n=>p.$queryRawUnsafe('SELECT COUNT(*) AS c FROM '+n).then(r=>n+'='+r[0].c)))
            .then(l=>{console.log(l.join(' '));return p.$disconnect()});
        run: |
          node dist/seed/cli.js
          node -e "$COUNT" > /tmp/seed-1.txt
          node dist/seed/cli.js
          node -e "$COUNT" > /tmp/seed-2.txt
          cat /tmp/seed-2.txt
          diff /tmp/seed-1.txt /tmp/seed-2.txt

  iac:
    name: Validate Terraform, Kubernetes and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: terraform validate
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init -backend=false -input=false && terraform validate
      - name: Render Kustomize overlays
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/saas > /dev/null
          kubectl kustomize infrastructure/kubernetes/overlays/dedicated > /dev/null
      # Every profile, including the test-only SMTP sinks (smtp-test). Rendering only: the
      # analytics/observability profiles are never started together with apps.
      - name: Validate docker-compose.yml
        run: >-
          cp .env.example .env && docker compose --profile apps --profile analytics
          --profile observability --profile smtp-test config -q

  stack:
    name: Docker Compose stack + integration tests
    runs-on: ubuntu-latest
    # Step 4.1 adds the scan stage to every message and the scan-* stack suites (an Rspamd outage
    # past the attempt budget alone takes about a minute), plus the rspamd package suite.
    timeout-minutes: 90
    needs: [quality]
    # Test profile of step 2.3 (docs/plan/steps/05-routing.md §5), for THIS job only. Compose
    # and the test runner take these over the generated .env (shell environment wins over .env
    # in Compose interpolation; process.loadEnvFile never overrides a set variable).
    # - DELIVERY_DEV_PASSTHROUGH_ENABLED: DEVELOPMENT/CI ONLY, the delivery-worker approves every
    #   SCANNED message (step 4.1 E27; never scan_failed) without policy (step 5.2 does not exist
    #   yet), so the routing, lifecycle and scan stack suites can deliver end to end. The worker refuses it unless APP_ENV is
    #   local or ci; never set it anywhere else.
    # - Postfix retry and connect timeout shortened by configuration only (nothing in code
    #   depends on them): 10s/60s/10s backoff, 5s connect timeout.
    # - The test CA of the smtp-test sinks (volume test-pki) for verified TLS to the provider
    #   sinks; trusted by nothing else.
    # - The worker's own hop retries quickly (local .env values).
    # - Step 4.1 (docs/plan/steps/09-rspamd.md §5, S12): the inbound rspamd resolves only the
    #   dns-sink test zones (scan.test), uses the test RBL/DBL zones instead of public blocklists
    #   and classifies with Bayes after 10 learns per class (test only), like the local .env; the
    #   ARC corpus fixtures need the test sealer arc-trusted.scan.test on the trusted list.
    env:
      DELIVERY_DEV_PASSTHROUGH_ENABLED: 'true'
      POSTFIX_MINIMAL_BACKOFF_TIME: 10s
      POSTFIX_MAXIMAL_BACKOFF_TIME: 60s
      POSTFIX_QUEUE_RUN_DELAY: 10s
      POSTFIX_OUTBOUND_SMTP_CONNECT_TIMEOUT: 5s
      POSTFIX_OUTBOUND_SMTP_TLS_CAPATH: /etc/postfix/test-ca/ca
      DELIVERY_REINJECT_LEASE_SECONDS: '120'
      DELIVERY_REINJECT_RETRY_BASE_SECONDS: '2'
      DELIVERY_REINJECT_RETRY_MAX_SECONDS: '20'
      DELIVERY_POLL_INTERVAL_MS: '500'
      DELIVERY_OUTBOX_POLL_INTERVAL_MS: '500'
      DELIVERY_RECONCILE_INTERVAL_MS: '5000'
      RSPAMD_DNS_SERVERS: 172.31.250.53
      RSPAMD_RBL_PROFILE: test
      RSPAMD_BAYES_MIN_LEARNS: '10'
      RSPAMD_ARC_TRUSTED_SEALERS: arc-trusted.scan.test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral credentials
        run: pnpm env:init
      # .env.example's SMTP_ADAPTER_HOST=smtp-adapter: both Postfix instances reach the adapter
      # container of the apps profile (locally it may be host.docker.internal instead).
      - name: Check the mail plane targets the adapter container
        run: grep -qx 'SMTP_ADAPTER_HOST=smtp-adapter' .env
      # apps + smtp-test: the stack suites FAIL without them, so they run in every CI build.
      # smtp-test = mail-sink, dns-sink, smtp-tools (step 2.2) and, for the routing suites
      # (tests/integration/routing-*.test.ts, step 2.3), test-pki (one-shot test CA), sink-m365,
      # sink-google, sink-google-alt, relay-sink and reinject-forwarder. The delivery-worker of the
      # apps profile reinjects into postfix-outbound directly (10026/10027).
      - name: Start infrastructure, application services and SMTP test sinks
        run: docker compose --profile apps --profile smtp-test up -d --build --wait --wait-timeout 900
      # The delivery-worker reads postfix-outbound's delivery log from the shared bind mount
      # (read-only); the routing suites read the same file on the runner.
      - name: Check the delivery-worker reads the delivery log and runs the test profile
        run: |
          docker compose exec -T delivery-worker test -r /var/log/postfix-outbound/maillog
          docker compose exec -T postfix-outbound postconf -h minimal_backoff_time | grep -qx 10s
          docker compose exec -T postfix-outbound postconf -h smtp_tls_CApath | grep -qx /etc/postfix/test-ca/ca
          test -r "${POSTFIX_OUTBOUND_LOG_DIR:-./.local/postfix-outbound-log}/maillog"
      # Step 4.1: the scan stage the stack gates require (tests/integration/support/scan-stage.ts):
      # Rspamd's rendered configuration, the email-worker scan role and topology v3 with the
      # eg-scanner user (rabbitmq-init exits non-zero without the scanner keys).
      - name: Check the scan stage (Rspamd, email-worker scan role, topology v3)
        run: |
          docker compose exec -T rspamd rspamadm configtest
          curl -fsS "http://127.0.0.1:${EMAIL_WORKER_HOST_PORT:-3020}/metrics" | grep -q '^# TYPE scan_engine_results_total '
          docker compose ps --all --format '{{.Service}} {{.ExitCode}}' rabbitmq-init | grep -qx 'rabbitmq-init 0'
      # The api integration tests need the catalog (plans, permissions, platform organization).
      - name: Seed catalog
        run: pnpm db:seed
      # DKIM keys of the SMTP suites are published by running the api's one-shot publisher
      # (`node dist/modules/domains/cli/dkim-sync.js`) inside the running api container
      # (tests/integration/support/smtp-fixtures.ts); the periodic publisher keeps running too.
      # pnpm test:integration = the stack suites (tests/, incl. the step 4.1 scan-* suites), then
      # the api, smtp-adapter, message-lifecycle, mail-routing, rspamd (corpus, Bayes, fuzzy
      # against the real Rspamd), delivery-worker, email-worker and event-relay suites.
      - name: Integration tests
        run: pnpm test:integration
      - name: Service logs
        if: failure()
        run: docker compose --profile apps --profile smtp-test logs --no-color --tail 200
      - name: Mail plane logs and queues
        if: failure()
        run: |
          docker compose --profile apps logs --no-color --tail 1000 postfix postfix-outbound smtp-adapter delivery-worker email-worker rspamd rspamd-outbound redis-dkim
          docker compose --profile smtp-test logs --no-color --tail 300 mail-sink dns-sink sink-m365 sink-google sink-google-alt relay-sink reinject-forwarder
          docker compose exec -T postfix postqueue -j || true
          docker compose exec -T postfix-outbound postqueue -j || true
      - name: Tear down
        if: always()
        run: docker compose --profile apps --profile smtp-test down -v
