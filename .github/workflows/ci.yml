name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, unit & e2e tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  migrations:
    name: Migrations apply cleanly and match the schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: email_gateway
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Throwaway CI database; not a secret.
      DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/email_gateway
      MIGRATION_DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/email_gateway
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # db:migrate builds the database package, runs the migration-history preflight
      # (dist/migrations/cli.js check), then prisma migrate deploy.
      - name: Apply migrations
        run: pnpm db:migrate
      # Partition maintenance as in Compose and the CronJob; the second run must be a no-op.
      - name: Partition maintenance
        working-directory: packages/database
        run: node dist/partitioning/cli.js apply && node dist/partitioning/cli.js apply
      # Prisma does not model partitions, so the drift check must stay clean after the split.
      - name: Fail if schema.prisma has changes without a migration
        working-directory: packages/database
        run: >-
          node node_modules/prisma/build/index.js migrate diff
          --from-url "$MIGRATION_DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - name: Seed catalog and demo data twice (idempotent)
        working-directory: packages/database
        env:
          APP_ENV: ci
          # Prints the row counts of the seeded tables; the second seed must not change them.
          COUNT: >-
            const {PrismaClient}=require('@prisma/client'); const p=new PrismaClient();
            const t=['permissions','roles','role_permissions','organization_plans','system_settings','organizations','users','user_roles','domains','email_policies','policy_versions'];
            Promise.all(t.map(n=>p.$queryRawUnsafe('SELECT COUNT(*) AS c FROM '+n).then(r=>n+'='+r[0].c)))
            .then(l=>{console.log(l.join(' '));return p.$disconnect()});
        run: |
          node dist/seed/cli.js
          node -e "$COUNT" > /tmp/seed-1.txt
          node dist/seed/cli.js
          node -e "$COUNT" > /tmp/seed-2.txt
          cat /tmp/seed-2.txt
          diff /tmp/seed-1.txt /tmp/seed-2.txt

  iac:
    name: Validate Terraform, Kubernetes and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: terraform validate
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init -backend=false -input=false && terraform validate
      - name: Render Kustomize overlays
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/saas > /dev/null
          kubectl kustomize infrastructure/kubernetes/overlays/dedicated > /dev/null
      # Every profile, including the test-only SMTP sinks (smtp-test). Rendering only: the
      # analytics/observability profiles are never started together with apps.
      - name: Validate docker-compose.yml
        run: >-
          cp .env.example .env && docker compose --profile apps --profile analytics
          --profile observability --profile smtp-test config -q

  stack:
    name: Docker Compose stack + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [quality]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral credentials
        run: pnpm env:init
      # .env.example's SMTP_ADAPTER_HOST=smtp-adapter: both Postfix instances reach the adapter
      # container of the apps profile (locally it may be host.docker.internal instead).
      - name: Check the mail plane targets the adapter container
        run: grep -qx 'SMTP_ADAPTER_HOST=smtp-adapter' .env
      # apps + smtp-test (mail-sink, dns-sink, smtp-tools): the stack SMTP suites
      # (tests/integration/smtp-*.test.ts) FAIL without them, so they run in every CI build.
      - name: Start infrastructure, application services and SMTP test sinks
        run: docker compose --profile apps --profile smtp-test up -d --build --wait --wait-timeout 900
      # The api integration tests need the catalog (plans, permissions, platform organization).
      - name: Seed catalog
        run: pnpm db:seed
      # DKIM keys of the SMTP suites are published by running the api's one-shot publisher
      # (`node dist/modules/domains/cli/dkim-sync.js`) inside the running api container
      # (tests/integration/support/smtp-fixtures.ts); the periodic publisher keeps running too.
      - name: Integration tests
        run: pnpm test:integration
      - name: Service logs
        if: failure()
        run: docker compose --profile apps --profile smtp-test logs --no-color --tail 200
      - name: Mail plane logs and queues
        if: failure()
        run: |
          docker compose --profile apps logs --no-color --tail 1000 postfix postfix-outbound smtp-adapter rspamd-outbound redis-dkim
          docker compose --profile smtp-test logs --no-color --tail 300 mail-sink dns-sink
          docker compose exec -T postfix postqueue -j || true
          docker compose exec -T postfix-outbound postqueue -j || true
      - name: Tear down
        if: always()
        run: docker compose --profile apps --profile smtp-test down -v
