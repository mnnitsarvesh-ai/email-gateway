          "fetch('http://127.0.0.1:3030/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  delivery-worker:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: delivery-worker },
      }
    image: email-gateway/delivery-worker:local
    depends_on:
      <<: *app-deps
      postfix-outbound: { condition: service_healthy }
    environment:
      <<: *node-env
      HTTP_PORT: 3040
      # Consumes email.delivery.pending (step 3.2): role user eg-delivery-worker.
      RABBITMQ_DELIVERY_WORKER_URL: amqp://${RABBITMQ_DELIVERY_WORKER_USER:-eg-delivery-worker}:${RABBITMQ_DELIVERY_WORKER_PASSWORD:?append the RabbitMQ keys from .env.example}@rabbitmq:5672/${RABBITMQ_VHOST:-email-gateway}
      DELIVERY_APPROVAL_PREFETCH: ${DELIVERY_APPROVAL_PREFETCH:-4}
      # Mail routing and delivery (step 2.3, docs/plan/steps/05-routing.md §5). Container values:
      # reinjection straight into postfix-outbound (on the host: the reinject-forwarder ports).
      DELIVERY_REINJECT_HOST: postfix-outbound
      DELIVERY_REINJECT_INBOUND_PORT: 10026
      DELIVERY_REINJECT_OUTBOUND_PORT: 10027
      DELIVERY_REINJECT_HELO: ${DELIVERY_REINJECT_HELO:-delivery.gateway.local}
      DELIVERY_REINJECT_CONCURRENCY: ${DELIVERY_REINJECT_CONCURRENCY:-8}
      DELIVERY_BATCH_MAX_RECIPIENTS: ${DELIVERY_BATCH_MAX_RECIPIENTS:-100}
      DELIVERY_REINJECT_COMMAND_TIMEOUT_MS: ${DELIVERY_REINJECT_COMMAND_TIMEOUT_MS:-60000}
      DELIVERY_REINJECT_DATA_TIMEOUT_MS: ${DELIVERY_REINJECT_DATA_TIMEOUT_MS:-600000}
      DELIVERY_REINJECT_LEASE_SECONDS: ${DELIVERY_REINJECT_LEASE_SECONDS:-900}
      DELIVERY_REINJECT_RETRY_BASE_SECONDS: ${DELIVERY_REINJECT_RETRY_BASE_SECONDS:-30}
      DELIVERY_REINJECT_RETRY_MAX_SECONDS: ${DELIVERY_REINJECT_RETRY_MAX_SECONDS:-900}
      DELIVERY_REINJECT_MAX_AGE_SECONDS: ${DELIVERY_REINJECT_MAX_AGE_SECONDS:-432000}
      # Step 4.2 §6.2: retry budget of a missing message context, and the budget of every
      # interactive transaction (longer than innodb_lock_wait_timeout and the stalls ridden out).
      DELIVERY_REINJECT_MAX_ATTEMPTS: ${DELIVERY_REINJECT_MAX_ATTEMPTS:-10}
      DELIVERY_DB_TX_TIMEOUT_MS: ${DELIVERY_DB_TX_TIMEOUT_MS:-120000}
      DELIVERY_POLL_INTERVAL_MS: ${DELIVERY_POLL_INTERVAL_MS:-1000}
      DELIVERY_OUTBOX_POLL_INTERVAL_MS: ${DELIVERY_OUTBOX_POLL_INTERVAL_MS:-1000}
      DELIVERY_OUTBOX_SAFETY_LAG_MS: ${DELIVERY_OUTBOX_SAFETY_LAG_MS:-120000}
      DELIVERY_OUTBOX_BATCH_SIZE: ${DELIVERY_OUTBOX_BATCH_SIZE:-500}
      DELIVERY_APPROVALS_ENABLED: ${DELIVERY_APPROVALS_ENABLED:-true}
      DELIVERY_REINJECTION_ENABLED: ${DELIVERY_REINJECTION_ENABLED:-true}
      DELIVERY_STATUS_LOG_ENABLED: ${DELIVERY_STATUS_LOG_ENABLED:-true}
      # DEVELOPMENT ONLY: delivers mail WITHOUT scanning or policy; refused unless APP_ENV is
      # local or ci. Off unless the .env turns it on.
      DELIVERY_DEV_PASSTHROUGH_ENABLED: ${DELIVERY_DEV_PASSTHROUGH_ENABLED:-false}
      DELIVERY_STATUS_LOG_PATH: /var/log/postfix-outbound/maillog
      DELIVERY_STATUS_LOG_SOURCE_ID: ${DELIVERY_STATUS_LOG_SOURCE_ID:-out.gateway.local}
      DELIVERY_STATUS_LOG_POLL_MS: ${DELIVERY_STATUS_LOG_POLL_MS:-500}
      DELIVERY_STATUS_UNMATCHED_RETRY_SECONDS: ${DELIVERY_STATUS_UNMATCHED_RETRY_SECONDS:-60}
      DELIVERY_STATUS_STALE_AFTER_SECONDS: ${DELIVERY_STATUS_STALE_AFTER_SECONDS:-518400}
      DELIVERY_RECONCILE_INTERVAL_MS: ${DELIVERY_RECONCILE_INTERVAL_MS:-30000}
      DELIVERY_RECONCILE_UNCONFIRMED_SECONDS: ${DELIVERY_RECONCILE_UNCONFIRMED_SECONDS:-3600}
      DELIVERY_RATE_TENANT_RCPT_PER_MINUTE: ${DELIVERY_RATE_TENANT_RCPT_PER_MINUTE:-600}
      DELIVERY_RATE_TENANT_DOMAIN_RCPT_PER_MINUTE: ${DELIVERY_RATE_TENANT_DOMAIN_RCPT_PER_MINUTE:-300}
      DELIVERY_RATE_DESTINATION_DOMAIN_RCPT_PER_MINUTE: ${DELIVERY_RATE_DESTINATION_DOMAIN_RCPT_PER_MINUTE:-6000}
      ROUTING_MAX_RECEIVED_HEADERS: ${ROUTING_MAX_RECEIVED_HEADERS:-25}
      ROUTING_MAX_GATEWAY_PASSES: ${ROUTING_MAX_GATEWAY_PASSES:-4}
      GATEWAY_TRACE_SECRET: ${GATEWAY_TRACE_SECRET:?append the SMTP gateway keys from .env.example}
      GATEWAY_TRACE_ID: ${GATEWAY_TRACE_ID:-gw-local}
      POSTFIX_OUTBOUND_MYHOSTNAME: ${POSTFIX_OUTBOUND_MYHOSTNAME:-out.gateway.local}
      INGEST_HEADER_MAX_BYTES: ${INGEST_HEADER_MAX_BYTES:-65536}
    # postfix-outbound's delivery log directory, read-only (the worker never writes it).
    volumes:
      - ${POSTFIX_OUTBOUND_LOG_DIR:-./.local/postfix-outbound-log}:/var/log/postfix-outbound:ro
    ports: ['127.0.0.1:${DELIVERY_WORKER_HOST_PORT:-3040}:3040']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3040/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # Outbox relay and reconciliation (step 3.2 Q11, Q12; ADR-0023): writer only, role user eg-relay.
  event-relay:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: event-relay },
      }
    image: email-gateway/event-relay:local
    environment:
      <<: *node-env
      HTTP_PORT: 3070
      RABBITMQ_RELAY_URL: amqp://${RABBITMQ_RELAY_USER:-eg-relay}:${RABBITMQ_RELAY_PASSWORD:?append the RabbitMQ keys from .env.example}@rabbitmq:5672/${RABBITMQ_VHOST:-email-gateway}
      RELAY_ENABLED: ${RELAY_ENABLED:-true}
      RECONCILE_ENABLED: ${RECONCILE_ENABLED:-true}
      RELAY_SHARDS: ${RELAY_SHARDS:-4}
      RELAY_MAX_HELD_SHARDS: ${RELAY_MAX_HELD_SHARDS:-4}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-200}
      RELAY_SCAN_LIMIT: ${RELAY_SCAN_LIMIT:-1000}
      RELAY_POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-250}
      RELAY_CONFIRM_TIMEOUT_MS: ${RELAY_CONFIRM_TIMEOUT_MS:-15000}
      RELAY_BROKER_BACKOFF_BASE_MS: ${RELAY_BROKER_BACKOFF_BASE_MS:-500}
      RELAY_BROKER_BACKOFF_MAX_MS: ${RELAY_BROKER_BACKOFF_MAX_MS:-30000}
      RELAY_ROW_BACKOFF_BASE_MS: ${RELAY_ROW_BACKOFF_BASE_MS:-1000}
      RELAY_ROW_BACKOFF_MAX_MS: ${RELAY_ROW_BACKOFF_MAX_MS:-300000}
      RELAY_MAX_ATTEMPTS: ${RELAY_MAX_ATTEMPTS:-10}
      RELAY_MAX_MESSAGE_BYTES: ${RELAY_MAX_MESSAGE_BYTES:-131072}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-60000}
      RECONCILE_UNCONSUMED_AFTER_SECONDS: ${RECONCILE_UNCONSUMED_AFTER_SECONDS:-900}
      RECONCILE_MAX_REDRIVES: ${RECONCILE_MAX_REDRIVES:-3}
      RECONCILE_LOOKBACK_HOURS: ${RECONCILE_LOOKBACK_HOURS:-72}
      RECONCILE_BATCH_SIZE: ${RECONCILE_BATCH_SIZE:-1000}
      RECONCILE_QUEUES: ${RECONCILE_QUEUES:-email.received,email.delivery.pending,scan.spam,scan.attachment,scan.url,scan.bec,scan.dlp,scan.sandbox.submissions}
      RECONCILE_START_POSITION: ${RECONCILE_START_POSITION:-oldest}
      # Message lifecycle jobs (step 3.3 L13, L14; docs/plan/steps/08-message-lifecycle.md §5).
      LIFECYCLE_EXPIRY_ENABLED: ${LIFECYCLE_EXPIRY_ENABLED:-true}
      LIFECYCLE_EXPIRY_INTERVAL_MS: ${LIFECYCLE_EXPIRY_INTERVAL_MS:-60000}
      LIFECYCLE_EXPIRY_SHARDS: ${LIFECYCLE_EXPIRY_SHARDS:-4}
      LIFECYCLE_EXPIRY_MAX_HELD_SHARDS: ${LIFECYCLE_EXPIRY_MAX_HELD_SHARDS:-4}
      LIFECYCLE_EXPIRY_BATCH_SIZE: ${LIFECYCLE_EXPIRY_BATCH_SIZE:-200}
      LIFECYCLE_EXPIRY_LOOKBACK_DAYS: ${LIFECYCLE_EXPIRY_LOOKBACK_DAYS:-186}
      LIFECYCLE_TX_TIMEOUT_MS: ${LIFECYCLE_TX_TIMEOUT_MS:-5000}
      LIFECYCLE_DEADLINE_PERSISTED_HOURS: ${LIFECYCLE_DEADLINE_PERSISTED_HOURS:-72}
      LIFECYCLE_DEADLINE_SCANNING_HOURS: ${LIFECYCLE_DEADLINE_SCANNING_HOURS:-24}
      LIFECYCLE_DEADLINE_SCANNED_HOURS: ${LIFECYCLE_DEADLINE_SCANNED_HOURS:-24}
      LIFECYCLE_DEADLINE_SCAN_FAILED_HOURS: ${LIFECYCLE_DEADLINE_SCAN_FAILED_HOURS:-72}
      LIFECYCLE_DEADLINE_POLICY_EVALUATED_HOURS: ${LIFECYCLE_DEADLINE_POLICY_EVALUATED_HOURS:-24}
      LIFECYCLE_DEADLINE_APPROVED_HOURS: ${LIFECYCLE_DEADLINE_APPROVED_HOURS:-24}
      LIFECYCLE_DEADLINE_QUARANTINED_HOURS: ${LIFECYCLE_DEADLINE_QUARANTINED_HOURS:-2160}
      LIFECYCLE_DEADLINE_HELD_FOR_REVIEW_HOURS: ${LIFECYCLE_DEADLINE_HELD_FOR_REVIEW_HOURS:-336}
      LIFECYCLE_DEADLINE_DELIVERY_PENDING_HOURS: ${LIFECYCLE_DEADLINE_DELIVERY_PENDING_HOURS:-168}
      LIFECYCLE_DEADLINE_DELIVERY_RETRY_HOURS: ${LIFECYCLE_DEADLINE_DELIVERY_RETRY_HOURS:-168}
      LIFECYCLE_CHECK_ENABLED: ${LIFECYCLE_CHECK_ENABLED:-true}
      LIFECYCLE_CHECK_INTERVAL_MS: ${LIFECYCLE_CHECK_INTERVAL_MS:-60000}
      LIFECYCLE_CHECK_AFTER_SECONDS: ${LIFECYCLE_CHECK_AFTER_SECONDS:-900}
      LIFECYCLE_CHECK_BATCH_SIZE: ${LIFECYCLE_CHECK_BATCH_SIZE:-500}
      LIFECYCLE_CHECK_LOOKBACK_HOURS: ${LIFECYCLE_CHECK_LOOKBACK_HOURS:-192}
    ports: ['127.0.0.1:${EVENT_RELAY_HOST_PORT:-3070}:3070']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3070/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  notification-worker:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: notification-worker },
      }
    image: email-gateway/notification-worker:local
    environment:
      <<: *node-env
      HTTP_PORT: 3050
    ports: ['127.0.0.1:${NOTIFICATION_WORKER_HOST_PORT:-3050}:3050']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3050/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  archive-worker:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: archive-worker },
      }
    image: email-gateway/archive-worker:local
    environment:
      <<: *node-env
      HTTP_PORT: 3060
    ports: ['127.0.0.1:${ARCHIVE_WORKER_HOST_PORT:-3060}:3060']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3060/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # Time-of-click service (step 4.3 U14, ADR-0031): public 3080 (GET /c/:token), admin 3081
  # (health, metrics). Its own MySQL account (CLICK_DATABASE_URL), Redis for rate limits and the
  # URL cache; no S3, no RabbitMQ, no app DATABASE_URL (x-node-env is not used on purpose).
  click-service:
    profiles: [apps]
    restart: unless-stopped
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: click-service },
      }
    image: email-gateway/click-service:local
    depends_on:
      mysql-grants: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      <<: *url-platform-env
      NODE_ENV: production
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      HTTP_HOST: 0.0.0.0
      CLICK_HTTP_PORT: 3080
      CLICK_ADMIN_PORT: 3081
      CLICK_DATABASE_URL: mysql://${MYSQL_CLICK_USER:-gateway_click}:${MYSQL_CLICK_PASSWORD:?append the URL protection keys from .env.example}@mysql:3306/${MYSQL_DATABASE:?}
      DATABASE_SOCKET_TIMEOUT_SECONDS: ${DATABASE_SOCKET_TIMEOUT_SECONDS:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      CLICK_DB_TX_TIMEOUT_MS: ${CLICK_DB_TX_TIMEOUT_MS:-120000}
      CLICK_RATE_LIMIT_IP_PER_MINUTE: ${CLICK_RATE_LIMIT_IP_PER_MINUTE:-120}
      CLICK_RATE_LIMIT_TOKEN_PER_MINUTE: ${CLICK_RATE_LIMIT_TOKEN_PER_MINUTE:-30}
      CLICK_RATE_LIMIT_INVALID_PER_MINUTE: ${CLICK_RATE_LIMIT_INVALID_PER_MINUTE:-20}
      CLICK_RECHECK_BUDGET_MS: ${CLICK_RECHECK_BUDGET_MS:-2500}
      CLICK_EVENT_WRITE_WAIT_MS: ${CLICK_EVENT_WRITE_WAIT_MS:-300}
      CLICK_EVENT_MAX_PENDING: ${CLICK_EVENT_MAX_PENDING:-1000}
      CLICK_CONTINUE_TTL_SECONDS: ${CLICK_CONTINUE_TTL_SECONDS:-600}
      CLICK_TRUST_PROXY: ${CLICK_TRUST_PROXY:-0}
      CLICK_STORE_CLIENT_NETWORK: ${CLICK_STORE_CLIENT_NETWORK:-true}
    networks:
      default: {}
      mailtest: {}
      urltest: {}
    volumes: ['test-pki:/pki:ro']
    ports:
      [
        '127.0.0.1:${CLICK_SERVICE_HOST_PORT:-3080}:3080',
        '127.0.0.1:${CLICK_SERVICE_ADMIN_HOST_PORT:-3081}:3081',
      ]
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3081/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # Isolated dynamic inspection (step 4.3 U15, ADR-0032), profile url-browser ONLY (never together
  # with analytics/observability on the 8 GB VM). Headless Chromium behind the egress proxy; the
  # container holds no DB/S3/Redis/token/cache secret and sits on the internal url-sandbox network
  # only (rabbitmq and url-egress-proxy). Its published port works only where Docker allows
  # publishing for a container without an external network (see §12 WP2).
  url-browser-worker:
    profiles: [url-browser]
    restart: unless-stopped
    build: { context: ., dockerfile: infrastructure/docker/url-browser-worker.Dockerfile }
    image: email-gateway/url-browser-worker:local
    command: ['node', '--enable-source-maps', 'dist/main.js']
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 1g
    cpus: 1
    user: '1000:1000'
    depends_on:
      rabbitmq: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      url-egress-proxy: { condition: service_healthy }
    environment:
      NODE_ENV: production
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0-local}
      HTTP_HOST: 0.0.0.0
      URL_BROWSER_HTTP_PORT: ${URL_BROWSER_HTTP_PORT:-3090}
      RABBITMQ_URL_BROWSER_URL: amqp://${RABBITMQ_URL_BROWSER_USER:-eg-url-browser}:${RABBITMQ_URL_BROWSER_PASSWORD:?append the URL protection keys from .env.example}@rabbitmq:5672/${RABBITMQ_VHOST:-email-gateway}
      URL_BROWSER_PROXY_URL: http://url-egress-proxy:3128
      URL_EGRESS_PROXY_TOKEN: ${URL_EGRESS_PROXY_TOKEN:?append the URL protection keys from .env.example}
      URL_BROWSER_CONCURRENCY: ${URL_BROWSER_CONCURRENCY:-1}
      URL_BROWSER_JOB_TIMEOUT_MS: ${URL_BROWSER_JOB_TIMEOUT_MS:-20000}
      URL_BROWSER_NAVIGATION_TIMEOUT_MS: ${URL_BROWSER_NAVIGATION_TIMEOUT_MS:-15000}
      URL_BROWSER_MAX_JOBS_PER_BROWSER: ${URL_BROWSER_MAX_JOBS_PER_BROWSER:-50}
      URL_BROWSER_MAX_RSS_MB: ${URL_BROWSER_MAX_RSS_MB:-768}
      URL_PROTECTED_BRANDS_FILE: ''
      URL_PROTECTED_EXTRA_DOMAINS: ${URL_PROTECTED_EXTRA_DOMAINS:-}
    networks:
      url-sandbox: {}
    ports: ['127.0.0.1:${URL_BROWSER_HOST_PORT:-3090}:3090']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3090/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # Egress proxy of the browser worker (U15): authenticated HTTP forward/CONNECT proxy that runs
  # the SSRF guard + restricted resolver (dns-sink) per request and dials the validated IP. Same
  # image as url-browser-worker (built there; one build, never in parallel on the 8 GB VM).
  url-egress-proxy:
    profiles: [url-browser]
    restart: unless-stopped
    image: email-gateway/url-browser-worker:local
    pull_policy: never
    command: ['node', '--enable-source-maps', 'dist/proxy-main.js']
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 256m
    user: '1000:1000'
    environment:
      NODE_ENV: production
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0-local}
      HTTP_HOST: 0.0.0.0
      URL_EGRESS_PORT: ${URL_EGRESS_PORT:-3128}
      URL_EGRESS_ADMIN_PORT: ${URL_EGRESS_ADMIN_PORT:-3091}
      URL_EGRESS_PROXY_TOKEN: ${URL_EGRESS_PROXY_TOKEN:?append the URL protection keys from .env.example}
      URL_EGRESS_MAX_CONNECTIONS: ${URL_EGRESS_MAX_CONNECTIONS:-64}
      URL_EGRESS_MAX_BYTES_PER_CONNECTION: ${URL_EGRESS_MAX_BYTES_PER_CONNECTION:-10485760}
      URL_EGRESS_IDLE_TIMEOUT_MS: ${URL_EGRESS_IDLE_TIMEOUT_MS:-15000}
      URL_EGRESS_MAX_CONNECTION_MS: ${URL_EGRESS_MAX_CONNECTION_MS:-30000}
      URL_DNS_SERVERS: 172.31.250.53
      URL_DNS_TIMEOUT_MS: ${URL_DNS_TIMEOUT_MS:-2000}
      URL_DNS_TRIES: ${URL_DNS_TRIES:-2}
      URL_FETCH_ALLOWED_PORTS: ${URL_FETCH_ALLOWED_PORTS:-80,443}
      URL_FETCH_DENY_CIDRS: ${URL_FETCH_DENY_CIDRS:-}
      URL_FETCH_DENY_HOSTS: ${URL_FETCH_DENY_HOSTS:-}
      URL_FETCH_CONNECT_TIMEOUT_MS: ${URL_FETCH_CONNECT_TIMEOUT_MS:-3000}
      # TEST-ONLY (APP_ENV=local): url-test lives in TEST-NET-3; the dial map is never used here.
      URL_FETCH_TEST_ALLOW_CIDRS: 203.0.113.0/24
      URL_FETCH_TEST_DIAL_MAP: ''
      URL_CLICK_BASE_URL: ${URL_CLICK_BASE_URL:-http://localhost:3080}
    networks:
      default: {}
      url-sandbox: { aliases: [url-egress-proxy] }
      mailtest: {}
      urltest: {}
    ports: ['127.0.0.1:${URL_EGRESS_ADMIN_HOST_PORT:-3091}:3091']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3091/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # Sandbox controller (step 4.6 X1, X5, X7; ADR-0039). Profile `apps` (since step 4.6 WP5).
  # SANDBOX_BACKEND defaults to `disabled`: nothing is executed (results not_executed → unknown,
  # never clean); `static` analyses without executing; `hardened-container` is refused here
  # (APP_ENV=local is allowed, but the opt-in SANDBOX_ALLOW_NON_VM_EXECUTION stays false and the
  # Docker socket is not mounted; only infrastructure/sandbox/compose.exec.yml, LOCAL/CI ONLY and
  # NOT A VM BOUNDARY, sets both); `vm` refuses to start (runner not implemented). Not the
  # x-node-env anchor: that carries database, Redis and MinIO root credentials, which the
  # controller refuses. Only its own broker user, its own MinIO user on the sandbox bucket, the
  # sample key, the result MAC key and the artifact PUBLIC key. Read-only root, tmpfs scratch,
  # no capabilities, no new privileges, bounded pids/memory/CPU, non-root, internal network only.
  sandbox-controller:
    profiles: [apps]
    restart: unless-stopped
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: sandbox-controller },
      }
    image: email-gateway/sandbox-controller:local
    read_only: true
    tmpfs:
      - /scratch:size=256m,mode=0700,uid=1000,gid=1000
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 384m
    cpus: 1
    user: '1000:1000'
    depends_on:
      rabbitmq: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0-local}
      HTTP_HOST: 0.0.0.0
      SANDBOX_HTTP_PORT: ${SANDBOX_HTTP_PORT:-3092}
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-disabled}
      SANDBOX_ALLOW_NON_VM_EXECUTION: ${SANDBOX_ALLOW_NON_VM_EXECUTION:-false}
      SANDBOX_CONTROLLER_NAME: ${SANDBOX_CONTROLLER_NAME:-sandbox-controller-local}
      RABBITMQ_SANDBOX_URL: amqp://${RABBITMQ_SANDBOX_USER:-eg-sandbox}:${RABBITMQ_SANDBOX_PASSWORD:?append the sandbox keys from .env.example}@rabbitmq:5672/${RABBITMQ_VHOST:-email-gateway}
      SANDBOX_S3_BUCKET: ${SANDBOX_S3_BUCKET:-email-gateway-sandbox}
      SANDBOX_S3_ENDPOINT: http://minio:9000
      SANDBOX_S3_REGION: ${SANDBOX_S3_REGION:-ap-south-1}
      SANDBOX_S3_FORCE_PATH_STYLE: 'true'
      SANDBOX_S3_ACCESS_KEY_ID: ${SANDBOX_S3_ACCESS_KEY_ID:-eg-sandbox-controller}
      SANDBOX_S3_SECRET_ACCESS_KEY: ${SANDBOX_S3_SECRET_ACCESS_KEY:?append the sandbox keys from .env.example}
      SANDBOX_SAMPLE_KEY: ${SANDBOX_SAMPLE_KEY:?append the sandbox keys from .env.example}
      SANDBOX_SAMPLE_KEY_PREVIOUS: ${SANDBOX_SAMPLE_KEY_PREVIOUS:-}
      SANDBOX_RESULT_KEY: ${SANDBOX_RESULT_KEY:?append the sandbox keys from .env.example}
      SANDBOX_ARTIFACT_PUBLIC_KEY: ${SANDBOX_ARTIFACT_PUBLIC_KEY:?append the sandbox keys from .env.example}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-1}
      SANDBOX_TASK_TIMEOUT_MS: ${SANDBOX_TASK_TIMEOUT_MS:-180000}
      SANDBOX_MAX_RUN_TIMEOUT_MS: ${SANDBOX_MAX_RUN_TIMEOUT_MS:-300000}
      SANDBOX_MAX_MEMORY_MB: ${SANDBOX_MAX_MEMORY_MB:-1024}
      SANDBOX_MAX_CPU_MILLIS: ${SANDBOX_MAX_CPU_MILLIS:-2000}
      SANDBOX_MAX_PIDS: ${SANDBOX_MAX_PIDS:-256}
      SANDBOX_MAX_SCRATCH_MB: ${SANDBOX_MAX_SCRATCH_MB:-256}
      SANDBOX_MAX_ARTIFACTS: ${SANDBOX_MAX_ARTIFACTS:-16}
      SANDBOX_MAX_ARTIFACT_BYTES: ${SANDBOX_MAX_ARTIFACT_BYTES:-2097152}
      SANDBOX_MAX_TOTAL_ARTIFACT_BYTES: ${SANDBOX_MAX_TOTAL_ARTIFACT_BYTES:-8388608}
      SANDBOX_MAX_SAMPLE_BYTES: ${SANDBOX_MAX_SAMPLE_BYTES:-26214400}
      # Container path (tmpfs above), not a host path from .env.
      SANDBOX_SCRATCH_DIR: /scratch
      SANDBOX_REAPER_INTERVAL_MS: ${SANDBOX_REAPER_INTERVAL_MS:-30000}
      SANDBOX_SELF_TEST_INTERVAL_MS: ${SANDBOX_SELF_TEST_INTERVAL_MS:-300000}
      SANDBOX_STATIC_HEAP_MB: ${SANDBOX_STATIC_HEAP_MB:-256}
      SANDBOX_STATIC_MAX_RSS_MB: ${SANDBOX_STATIC_MAX_RSS_MB:-384}
      SANDBOX_STATIC_CPU_SECONDS: ${SANDBOX_STATIC_CPU_SECONDS:-20}
      SANDBOX_STATIC_TIMEOUT_MS: ${SANDBOX_STATIC_TIMEOUT_MS:-30000}
      SANDBOX_VM_RUNTIME_CLASS: ${SANDBOX_VM_RUNTIME_CLASS:-gvisor}
      SANDBOX_VM_ALLOWED_HANDLERS: ${SANDBOX_VM_ALLOWED_HANDLERS:-runsc,kata,kata-qemu,kata-clh,kata-fc}
      SANDBOX_VM_NAMESPACE: ${SANDBOX_VM_NAMESPACE:-email-gateway-sandbox-runners}
    networks:
      sandbox-control: {}
    ports: ['127.0.0.1:${SANDBOX_CONTROLLER_HOST_PORT:-3092}:3092']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3092/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  admin-portal:
    profiles: [apps]
    restart: unless-stopped
    build: { context: ., dockerfile: infrastructure/docker/admin-portal.Dockerfile }
    image: email-gateway/admin-portal:local
    environment:
      API_INTERNAL_URL: http://api:3000
    ports: ['127.0.0.1:${ADMIN_PORTAL_HOST_PORT:-3001}:3001']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # ---------------------------------------------------------------- TEST-ONLY broker cluster (profile: rabbitmq-cluster)
  # Three quorum-replicating nodes for the broker node-failure test (step 3.2 §7, §10). Never
  # started by infra:up/stack:up; never run together with the apps profile on an 8 GB VM. The
  # test procedure removes the three rabbitmq-cluster-*-data volumes explicitly (never down -v).
  # AMQP 127.0.0.1:5701-5703, management (node 1) 127.0.0.1:15701.
  rabbitmq-node1:
    <<: *rabbitmq-cluster-node
    hostname: rmq1
    networks:
      default:
        aliases: [rmq1]
    volumes:
      - rabbitmq-cluster-1-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - ./infrastructure/rabbitmq/cluster/entrypoint.sh:/cluster-entrypoint.sh:ro
    ports:
      [
        '127.0.0.1:${RABBITMQ_CLUSTER_NODE1_HOST_PORT:-5701}:5672',
        '127.0.0.1:${RABBITMQ_CLUSTER_MGMT_HOST_PORT:-15701}:15672',
      ]

  rabbitmq-node2:
    <<: *rabbitmq-cluster-node
    hostname: rmq2
    networks:
      default:
        aliases: [rmq2]
    volumes:
      - rabbitmq-cluster-2-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - ./infrastructure/rabbitmq/cluster/entrypoint.sh:/cluster-entrypoint.sh:ro
    ports: ['127.0.0.1:${RABBITMQ_CLUSTER_NODE2_HOST_PORT:-5702}:5672']

  rabbitmq-node3:
    <<: *rabbitmq-cluster-node
    hostname: rmq3
    networks:
      default:
        aliases: [rmq3]
    volumes:
      - rabbitmq-cluster-3-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - ./infrastructure/rabbitmq/cluster/entrypoint.sh:/cluster-entrypoint.sh:ro
    ports: ['127.0.0.1:${RABBITMQ_CLUSTER_NODE3_HOST_PORT:-5703}:5672']

  # ---------------------------------------------------------------- search & analytics (profile: analytics)
  opensearch:
    profiles: [analytics]
    image: opensearchproject/opensearch:2.19.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Local development only. Staging/production use Amazon OpenSearch with fine-grained access control.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: ['opensearch-data:/usr/share/opensearch/data']
    ports: ['127.0.0.1:${OPENSEARCH_HOST_PORT:-9200}:9200']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  clickhouse:
    profiles: [analytics]
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ['clickhouse-data:/var/lib/clickhouse']
    ports: ['127.0.0.1:${CLICKHOUSE_HOST_PORT:-8123}:8123']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # ---------------------------------------------------------------- observability (profile: observability)
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318']

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules (step 3.2 Q15), loaded through rule_files in prometheus.yml.
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # Read password of the inbound Rspamd controller for the `rspamd` scrape job (step 4.1 S17),
    # mounted at /run/secrets/rspamd_controller_password; never written into prometheus.yml.
    secrets: [rspamd_controller_password]
    ports: ['127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:${GRAFANA_HOST_PORT:-3100}:3000']
    depends_on: [prometheus]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  # Compose secrets from the environment (.env), mounted read-only under /run/secrets.
  rspamd_controller_password:
    environment: RSPAMD_CONTROLLER_PASSWORD

volumes:
  mysql-data:
  mysql-replica-data:
  rabbitmq-data:
  # TEST-ONLY 3-node cluster (profile rabbitmq-cluster).
  rabbitmq-cluster-1-data:
  rabbitmq-cluster-2-data:
  rabbitmq-cluster-3-data:
  redis-data:
  minio-data:
  rspamd-data:
  clamav-db:
  postfix-spool:
  postfix-outbound-spool:
  rspamd-outbound-data:
  postfix-notify-spool:
  # TEST-ONLY test CA and sink certificates (step 2.3, test-pki service).
  test-pki:
  opensearch-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:

networks:
  default: {}
  # Isolated mail test network (step 2.2 D17): dns-sink .53, mail-sink .25, plus postfix-outbound
  # and smtp-tools. Fixed subnet so dns-sink can be the outbound MTA's only resolver. Step 2.3:
  # postfix (gateway MX) .10, sink-m365 .26, sink-google .27, sink-google-alt .28, relay-sink .29,
  # reinject-forwarder .30. Step 4.3: url-test .60 (rebinding DNS responder for dns-sink); the
  # email-worker, click-service and url-egress-proxy join it to resolve through dns-sink. Dynamic addresses come from the upper half only (ip_range), so they
  # can never take one of the fixed addresses.
  mailtest:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
          ip_range: 172.31.250.128/25
  # DKIM signing path (step 2.2 D12): rspamd-outbound signs for every milter client, so it is
  # attached only here, together with postfix-outbound (its only milter client) and redis-dkim
  # (its key store). internal: no route outside the network, nothing published.
  dkim-signing:
    internal: true
  # TEST-ONLY "Internet" of step 4.3 (U19): TEST-NET-3, url-test fixed at .10; dynamic addresses
  # (email-worker, click-service, url-egress-proxy) come from the upper half only.
  urltest:
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.1
          ip_range: 203.0.113.128/25
  # The browser worker's network (U15): internal (no route out); only url-egress-proxy and
  # rabbitmq are on it.
  url-sandbox:
    internal: true
  # Step 4.6 X5: the sandbox-controller's only network (internal, no route out): rabbitmq and
  # minio (aliases), and the sinkhole's admin address .53 (exec override only). Dynamic addresses
  # from the upper half only, so they never take a fixed address.
  sandbox-control:
    internal: true
    ipam:
      config:
        - subnet: 172.31.252.0/24
          ip_range: 172.31.252.128/25
  # Step 4.6 X5: the runners' only network (internal): runner containers and the sinkhole (.53).
  # Defined here so its name is stable (email-gateway_sandbox-detonation = SANDBOX_RUNNER_NETWORK);
  # only the local/CI exec override attaches services to it. The controller is never on it.
  # `gateway_mode_ipv4: isolated` (Docker >= 28): the bridge gets no address on the Docker host,
  # so runners reach the sinkhole and nothing else (step 4.6 §12 WP4 finding F1; the
  # hardened-container self-test refuses a detonation network without it). Kept here as well as
  # in the exec override so both definitions of the network are identical.
  sandbox-detonation:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.31.253.0/24
          ip_range: 172.31.253.128/25
