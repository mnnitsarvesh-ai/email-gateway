      MIME_S3_PART_SIZE_BYTES: ${MIME_S3_PART_SIZE_BYTES:-5242880}
      MIME_S3_QUEUE_SIZE: ${MIME_S3_QUEUE_SIZE:-2}
      MIME_MEMORY_BUDGET_BYTES: ${MIME_MEMORY_BUDGET_BYTES:-268435456}
      MIME_MAX_MESSAGE_BYTES: ${MIME_MAX_MESSAGE_BYTES:-53477376}
      MIME_MAX_DEPTH: ${MIME_MAX_DEPTH:-10}
      MIME_MAX_PARTS: ${MIME_MAX_PARTS:-250}
      MIME_MAX_HEADERS: ${MIME_MAX_HEADERS:-1000}
      MIME_MAX_HEADER_LINE_BYTES: ${MIME_MAX_HEADER_LINE_BYTES:-32768}
      MIME_MAX_HEADER_BLOCK_BYTES: ${MIME_MAX_HEADER_BLOCK_BYTES:-262144}
      MIME_MAX_ATTACHMENTS: ${MIME_MAX_ATTACHMENTS:-100}
      MIME_MAX_ATTACHMENT_BYTES: ${MIME_MAX_ATTACHMENT_BYTES:-26214400}
      MIME_MAX_BODY_BYTES: ${MIME_MAX_BODY_BYTES:-10485760}
      MIME_MAX_DECODED_RATIO: ${MIME_MAX_DECODED_RATIO:-1.1}
      MIME_MAX_TOTAL_DECODED_BYTES: ${MIME_MAX_TOTAL_DECODED_BYTES:-104857600}
      MIME_PARSE_TIMEOUT_MS: ${MIME_PARSE_TIMEOUT_MS:-120000}
      MIME_MAX_STORED_HEADERS: ${MIME_MAX_STORED_HEADERS:-200}
      MIME_FILENAME_MAX_CHARS: ${MIME_FILENAME_MAX_CHARS:-200}
      MIME_ARCHIVE_MAX_ENTRIES: ${MIME_ARCHIVE_MAX_ENTRIES:-1000}
      MIME_ARCHIVE_MAX_RATIO: ${MIME_ARCHIVE_MAX_RATIO:-100}
      MIME_ARCHIVE_MAX_TOTAL_UNCOMPRESSED_BYTES: ${MIME_ARCHIVE_MAX_TOTAL_UNCOMPRESSED_BYTES:-1073741824}
      MIME_ARCHIVE_MAX_CENTRAL_DIRECTORY_BYTES: ${MIME_ARCHIVE_MAX_CENTRAL_DIRECTORY_BYTES:-8388608}
    ports: ['127.0.0.1:${EMAIL_WORKER_HOST_PORT:-3020}:3020']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3020/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  policy-engine:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: policy-engine },
      }
    image: email-gateway/policy-engine:local
    environment:
      <<: *node-env
      HTTP_PORT: 3030
    ports: ['127.0.0.1:${POLICY_ENGINE_HOST_PORT:-3030}:3030']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3030/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  delivery-worker:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: delivery-worker },
      }
    image: email-gateway/delivery-worker:local
    depends_on:
      <<: *app-deps
      postfix-outbound: { condition: service_healthy }
    environment:
      <<: *node-env
      HTTP_PORT: 3040
      # Consumes email.delivery.pending (step 3.2): role user eg-delivery-worker.
      RABBITMQ_DELIVERY_WORKER_URL: amqp://${RABBITMQ_DELIVERY_WORKER_USER:-eg-delivery-worker}:${RABBITMQ_DELIVERY_WORKER_PASSWORD:?append the RabbitMQ keys from .env.example}@rabbitmq:5672/${RABBITMQ_VHOST:-email-gateway}
      DELIVERY_APPROVAL_PREFETCH: ${DELIVERY_APPROVAL_PREFETCH:-4}
      # Mail routing and delivery (step 2.3, docs/plan/steps/05-routing.md §5). Container values:
      # reinjection straight into postfix-outbound (on the host: the reinject-forwarder ports).
      DELIVERY_REINJECT_HOST: postfix-outbound
      DELIVERY_REINJECT_INBOUND_PORT: 10026
      DELIVERY_REINJECT_OUTBOUND_PORT: 10027
      DELIVERY_REINJECT_HELO: ${DELIVERY_REINJECT_HELO:-delivery.gateway.local}
      DELIVERY_REINJECT_CONCURRENCY: ${DELIVERY_REINJECT_CONCURRENCY:-8}
      DELIVERY_BATCH_MAX_RECIPIENTS: ${DELIVERY_BATCH_MAX_RECIPIENTS:-100}
      DELIVERY_REINJECT_COMMAND_TIMEOUT_MS: ${DELIVERY_REINJECT_COMMAND_TIMEOUT_MS:-60000}
      DELIVERY_REINJECT_DATA_TIMEOUT_MS: ${DELIVERY_REINJECT_DATA_TIMEOUT_MS:-600000}
      DELIVERY_REINJECT_LEASE_SECONDS: ${DELIVERY_REINJECT_LEASE_SECONDS:-900}
      DELIVERY_REINJECT_RETRY_BASE_SECONDS: ${DELIVERY_REINJECT_RETRY_BASE_SECONDS:-30}
      DELIVERY_REINJECT_RETRY_MAX_SECONDS: ${DELIVERY_REINJECT_RETRY_MAX_SECONDS:-900}
      DELIVERY_REINJECT_MAX_AGE_SECONDS: ${DELIVERY_REINJECT_MAX_AGE_SECONDS:-432000}
      DELIVERY_POLL_INTERVAL_MS: ${DELIVERY_POLL_INTERVAL_MS:-1000}
      DELIVERY_OUTBOX_POLL_INTERVAL_MS: ${DELIVERY_OUTBOX_POLL_INTERVAL_MS:-1000}
      DELIVERY_OUTBOX_SAFETY_LAG_MS: ${DELIVERY_OUTBOX_SAFETY_LAG_MS:-120000}
      DELIVERY_OUTBOX_BATCH_SIZE: ${DELIVERY_OUTBOX_BATCH_SIZE:-500}
      DELIVERY_APPROVALS_ENABLED: ${DELIVERY_APPROVALS_ENABLED:-true}
      DELIVERY_REINJECTION_ENABLED: ${DELIVERY_REINJECTION_ENABLED:-true}
      DELIVERY_STATUS_LOG_ENABLED: ${DELIVERY_STATUS_LOG_ENABLED:-true}
      # DEVELOPMENT ONLY: delivers mail WITHOUT scanning or policy; refused unless APP_ENV is
      # local or ci. Off unless the .env turns it on.
      DELIVERY_DEV_PASSTHROUGH_ENABLED: ${DELIVERY_DEV_PASSTHROUGH_ENABLED:-false}
      DELIVERY_STATUS_LOG_PATH: /var/log/postfix-outbound/maillog
      DELIVERY_STATUS_LOG_SOURCE_ID: ${DELIVERY_STATUS_LOG_SOURCE_ID:-out.gateway.local}
      DELIVERY_STATUS_LOG_POLL_MS: ${DELIVERY_STATUS_LOG_POLL_MS:-500}
      DELIVERY_STATUS_UNMATCHED_RETRY_SECONDS: ${DELIVERY_STATUS_UNMATCHED_RETRY_SECONDS:-60}
      DELIVERY_STATUS_STALE_AFTER_SECONDS: ${DELIVERY_STATUS_STALE_AFTER_SECONDS:-518400}
      DELIVERY_RECONCILE_INTERVAL_MS: ${DELIVERY_RECONCILE_INTERVAL_MS:-30000}
      DELIVERY_RECONCILE_UNCONFIRMED_SECONDS: ${DELIVERY_RECONCILE_UNCONFIRMED_SECONDS:-3600}
      DELIVERY_RATE_TENANT_RCPT_PER_MINUTE: ${DELIVERY_RATE_TENANT_RCPT_PER_MINUTE:-600}
      DELIVERY_RATE_TENANT_DOMAIN_RCPT_PER_MINUTE: ${DELIVERY_RATE_TENANT_DOMAIN_RCPT_PER_MINUTE:-300}
      DELIVERY_RATE_DESTINATION_DOMAIN_RCPT_PER_MINUTE: ${DELIVERY_RATE_DESTINATION_DOMAIN_RCPT_PER_MINUTE:-6000}
      ROUTING_MAX_RECEIVED_HEADERS: ${ROUTING_MAX_RECEIVED_HEADERS:-25}
      ROUTING_MAX_GATEWAY_PASSES: ${ROUTING_MAX_GATEWAY_PASSES:-4}
      GATEWAY_TRACE_SECRET: ${GATEWAY_TRACE_SECRET:?append the SMTP gateway keys from .env.example}
      GATEWAY_TRACE_ID: ${GATEWAY_TRACE_ID:-gw-local}
      POSTFIX_OUTBOUND_MYHOSTNAME: ${POSTFIX_OUTBOUND_MYHOSTNAME:-out.gateway.local}
      INGEST_HEADER_MAX_BYTES: ${INGEST_HEADER_MAX_BYTES:-65536}
    # postfix-outbound's delivery log directory, read-only (the worker never writes it).
    volumes:
      - ${POSTFIX_OUTBOUND_LOG_DIR:-./.local/postfix-outbound-log}:/var/log/postfix-outbound:ro
    ports: ['127.0.0.1:${DELIVERY_WORKER_HOST_PORT:-3040}:3040']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3040/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # Outbox relay and reconciliation (step 3.2 Q11, Q12; ADR-0023): writer only, role user eg-relay.
  event-relay:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: event-relay },
      }
    image: email-gateway/event-relay:local
    environment:
      <<: *node-env
      HTTP_PORT: 3070
      RABBITMQ_RELAY_URL: amqp://${RABBITMQ_RELAY_USER:-eg-relay}:${RABBITMQ_RELAY_PASSWORD:?append the RabbitMQ keys from .env.example}@rabbitmq:5672/${RABBITMQ_VHOST:-email-gateway}
      RELAY_ENABLED: ${RELAY_ENABLED:-true}
      RECONCILE_ENABLED: ${RECONCILE_ENABLED:-true}
      RELAY_SHARDS: ${RELAY_SHARDS:-4}
      RELAY_MAX_HELD_SHARDS: ${RELAY_MAX_HELD_SHARDS:-4}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-200}
      RELAY_SCAN_LIMIT: ${RELAY_SCAN_LIMIT:-1000}
      RELAY_POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-250}
      RELAY_CONFIRM_TIMEOUT_MS: ${RELAY_CONFIRM_TIMEOUT_MS:-15000}
      RELAY_BROKER_BACKOFF_BASE_MS: ${RELAY_BROKER_BACKOFF_BASE_MS:-500}
      RELAY_BROKER_BACKOFF_MAX_MS: ${RELAY_BROKER_BACKOFF_MAX_MS:-30000}
      RELAY_ROW_BACKOFF_BASE_MS: ${RELAY_ROW_BACKOFF_BASE_MS:-1000}
      RELAY_ROW_BACKOFF_MAX_MS: ${RELAY_ROW_BACKOFF_MAX_MS:-300000}
      RELAY_MAX_ATTEMPTS: ${RELAY_MAX_ATTEMPTS:-10}
      RELAY_MAX_MESSAGE_BYTES: ${RELAY_MAX_MESSAGE_BYTES:-131072}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-60000}
      RECONCILE_UNCONSUMED_AFTER_SECONDS: ${RECONCILE_UNCONSUMED_AFTER_SECONDS:-900}
      RECONCILE_MAX_REDRIVES: ${RECONCILE_MAX_REDRIVES:-3}
      RECONCILE_LOOKBACK_HOURS: ${RECONCILE_LOOKBACK_HOURS:-72}
      RECONCILE_BATCH_SIZE: ${RECONCILE_BATCH_SIZE:-1000}
      RECONCILE_QUEUES: ${RECONCILE_QUEUES:-email.received,email.delivery.pending}
      RECONCILE_START_POSITION: ${RECONCILE_START_POSITION:-oldest}
    ports: ['127.0.0.1:${EVENT_RELAY_HOST_PORT:-3070}:3070']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3070/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  notification-worker:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: notification-worker },
      }
    image: email-gateway/notification-worker:local
    environment:
      <<: *node-env
      HTTP_PORT: 3050
    ports: ['127.0.0.1:${NOTIFICATION_WORKER_HOST_PORT:-3050}:3050']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3050/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  archive-worker:
    <<: *node-service
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/node-service.Dockerfile,
        args: { APP: archive-worker },
      }
    image: email-gateway/archive-worker:local
    environment:
      <<: *node-env
      HTTP_PORT: 3060
    ports: ['127.0.0.1:${ARCHIVE_WORKER_HOST_PORT:-3060}:3060']
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3060/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  admin-portal:
    profiles: [apps]
    restart: unless-stopped
    build: { context: ., dockerfile: infrastructure/docker/admin-portal.Dockerfile }
    image: email-gateway/admin-portal:local
    environment:
      API_INTERNAL_URL: http://api:3000
    ports: ['127.0.0.1:${ADMIN_PORTAL_HOST_PORT:-3001}:3001']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # ---------------------------------------------------------------- TEST-ONLY broker cluster (profile: rabbitmq-cluster)
  # Three quorum-replicating nodes for the broker node-failure test (step 3.2 §7, §10). Never
  # started by infra:up/stack:up; never run together with the apps profile on an 8 GB VM. The
  # test procedure removes the three rabbitmq-cluster-*-data volumes explicitly (never down -v).
  # AMQP 127.0.0.1:5701-5703, management (node 1) 127.0.0.1:15701.
  rabbitmq-node1:
    <<: *rabbitmq-cluster-node
    hostname: rmq1
    networks:
      default:
        aliases: [rmq1]
    volumes:
      - rabbitmq-cluster-1-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - ./infrastructure/rabbitmq/cluster/entrypoint.sh:/cluster-entrypoint.sh:ro
    ports:
      [
        '127.0.0.1:${RABBITMQ_CLUSTER_NODE1_HOST_PORT:-5701}:5672',
        '127.0.0.1:${RABBITMQ_CLUSTER_MGMT_HOST_PORT:-15701}:15672',
      ]

  rabbitmq-node2:
    <<: *rabbitmq-cluster-node
    hostname: rmq2
    networks:
      default:
        aliases: [rmq2]
    volumes:
      - rabbitmq-cluster-2-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - ./infrastructure/rabbitmq/cluster/entrypoint.sh:/cluster-entrypoint.sh:ro
    ports: ['127.0.0.1:${RABBITMQ_CLUSTER_NODE2_HOST_PORT:-5702}:5672']

  rabbitmq-node3:
    <<: *rabbitmq-cluster-node
    hostname: rmq3
    networks:
      default:
        aliases: [rmq3]
    volumes:
      - rabbitmq-cluster-3-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - ./infrastructure/rabbitmq/cluster/entrypoint.sh:/cluster-entrypoint.sh:ro
    ports: ['127.0.0.1:${RABBITMQ_CLUSTER_NODE3_HOST_PORT:-5703}:5672']

  # ---------------------------------------------------------------- search & analytics (profile: analytics)
  opensearch:
    profiles: [analytics]
    image: opensearchproject/opensearch:2.19.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Local development only. Staging/production use Amazon OpenSearch with fine-grained access control.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: ['opensearch-data:/usr/share/opensearch/data']
    ports: ['127.0.0.1:${OPENSEARCH_HOST_PORT:-9200}:9200']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  clickhouse:
    profiles: [analytics]
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ['clickhouse-data:/var/lib/clickhouse']
    ports: ['127.0.0.1:${CLICKHOUSE_HOST_PORT:-8123}:8123']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # ---------------------------------------------------------------- observability (profile: observability)
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318']

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules (step 3.2 Q15), loaded through rule_files in prometheus.yml.
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:${GRAFANA_HOST_PORT:-3100}:3000']
    depends_on: [prometheus]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  mysql-replica-data:
  rabbitmq-data:
  # TEST-ONLY 3-node cluster (profile rabbitmq-cluster).
  rabbitmq-cluster-1-data:
  rabbitmq-cluster-2-data:
  rabbitmq-cluster-3-data:
  redis-data:
  minio-data:
  rspamd-data:
  clamav-db:
  postfix-spool:
  postfix-outbound-spool:
  rspamd-outbound-data:
  postfix-notify-spool:
  # TEST-ONLY test CA and sink certificates (step 2.3, test-pki service).
  test-pki:
  opensearch-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:

networks:
  default: {}
  # Isolated mail test network (step 2.2 D17): dns-sink .53, mail-sink .25, plus postfix-outbound
  # and smtp-tools. Fixed subnet so dns-sink can be the outbound MTA's only resolver. Step 2.3:
  # postfix (gateway MX) .10, sink-m365 .26, sink-google .27, sink-google-alt .28, relay-sink .29,
  # reinject-forwarder .30. Dynamic addresses come from the upper half only (ip_range), so they
  # can never take one of the fixed addresses.
  mailtest:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
          ip_range: 172.31.250.128/25
  # DKIM signing path (step 2.2 D12): rspamd-outbound signs for every milter client, so it is
  # attached only here, together with postfix-outbound (its only milter client) and redis-dkim
  # (its key store). internal: no route outside the network, nothing published.
  dkim-signing:
    internal: true
