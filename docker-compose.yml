# Local development stack.
#
#   pnpm env:init                                   # once: create .env with random secrets
#   docker compose up -d --wait                     # infrastructure only (default), including the
#                                                   # MySQL replica, seeded by mysql-replica-setup
#   docker compose --profile apps up -d --build --wait     # + migrations and all services
#   docker compose --profile analytics up -d --wait        # + OpenSearch, ClickHouse
#   docker compose --profile observability up -d --wait    # + OTel Collector, Prometheus, Grafana
#   docker compose --profile smtp-test up -d --wait # + test-only SMTP sinks, test PKI, DNS,
#                                                   #   client tools and the reinject-forwarder
#   docker compose --profile rabbitmq-cluster up -d --wait rabbitmq-node1 rabbitmq-node2 \
#     rabbitmq-node3                                # TEST-ONLY 3-node broker (node-failure test)
#
# Every published port binds to 127.0.0.1 only. Credentials come from .env (never defaults).
# MySQL runs as a GTID primary (`mysql`, writer) plus a read replica (`mysql-replica`); only the
# api reads from the replica. See docs/database/replication.md.
#
# Mail plane (step 2.2, docs/deployment/smtp-gateway.md): `postfix` (inbound MX, 25 behind
# postscreen), `postfix-outbound` (submission 587, connector relay 25, internal reinjection
# 10026/10027, never published), `rspamd` (inbound content milter and, since step 4.1, the
# post-queue scan engine; docs/deployment/rspamd.md), `rspamd-outbound` (DKIM signing milter of
# 10027 only), `redis-dkim` (DKIM keys, ACL per role, no persistence).
# Both Postfix instances reach smtp-adapter at SMTP_ADAPTER_HOST: `smtp-adapter` (apps profile,
# CI) or `host.docker.internal` (adapter run on the host with pnpm dev). Without the adapter
# every lookup, policy check, AUTH and LMTP delivery fails closed (4xx). postfix-outbound
# resolves DNS only through dns-sink (network `mailtest`), so locally it can never reach the
# Internet.
#
# Mail routing (step 2.3, docs/deployment/mail-routing.md): the delivery-worker reinjects approved
# mail into postfix-outbound 10026 (tenant destinations) / 10027 (Internet MX, transport_maps
# bypassed) and reads postfix-outbound's delivery log (${POSTFIX_OUTBOUND_LOG_DIR}, read-only).
#
# Messaging (step 3.2, docs/architecture/messaging-topology.md): `rabbitmq-init` (one-shot,
# default profile) provisions vhost ${RABBITMQ_VHOST} from infrastructure/rabbitmq/definitions.json
# (6 exchanges, 14 quorum queues, bindings, policies) and the least-privilege role users, and
# removes the empty ADR-0005 objects on vhost "/". Every app waits for it. Services never declare
# topology and each one gets only its own role URL (no RABBITMQ_URL): email-worker
# RABBITMQ_EMAIL_WORKER_URL, delivery-worker RABBITMQ_DELIVERY_WORKER_URL, api RABBITMQ_OPS_URL,
# event-relay (outbox relay and reconciler, ADR-0023) RABBITMQ_RELAY_URL. policy-engine,
# archive-worker and notification-worker consume nothing yet and do not connect to RabbitMQ.
#
# Security scanning (step 4.1, docs/plan/steps/09-rspamd.md, ADR-0026/ADR-0027): the email-worker
# scan role consumes scan.spam as eg-scanner (RABBITMQ_SCANNER_URL) and scans every parsed
# message with `rspamd` /checkv2 (SCAN_RSPAMD_URL); the api trains Bayes/fuzzy through the
# controller with the enable password. Postfix accepts when the milter is down (ADR-0027).
# Locally/CI rspamd resolves only the dns-sink test zones (RSPAMD_DNS_SERVERS, mailtest .11).
#
# URL protection (step 4.3, docs/plan/steps/11-url-protection.md, ADR-0029..0032): the email-worker
# url engine (scan.url) fetches through the SSRF-guarded fetcher and resolves ONLY through
# dns-sink (URL_DNS_SERVERS, mailtest .53); it joins `mailtest` and `urltest`. `click-service`
# (apps profile, 3080 public / 3081 admin) uses its own MySQL account gateway_click, created by the
# `mysql-grants` one-shot after db-migrate (01-users.sh needs the migrated tables), and Redis; no
# S3, no RabbitMQ. `url-browser-worker` + `url-egress-proxy` run only in profile `url-browser`
# (never together with analytics/observability on the 8 GB VM): the browser sits on the internal
# network `url-sandbox` (only the proxy and rabbitmq) and holds no DB/S3/Redis/token/cache secret.
# TEST-ONLY `url-test` (smtp-test profile) is the local "Internet": 203.0.113.10 on `urltest`,
# 172.31.250.60 on `mailtest` (its DNS responder serves the rebinding name for dns-sink).
#   docker compose --profile smtp-test --profile apps --profile url-browser up -d --wait
#
# Sandbox (step 4.6, docs/plan/steps/14-sandbox.md, ADR-0039/0040, threat model
# docs/security/sandbox-threat-model.md): `sandbox-controller` runs only in profile `sandbox`
# (WP5 moves it to `apps`) with SANDBOX_BACKEND=disabled by default: EXECUTION OF UNKNOWN FILES IS
# DISABLED. It sits only on the internal network `sandbox-control` (rabbitmq + minio), holds no
# DB/Redis/main-S3/token key (not the x-node-env anchor), uses its own broker user eg-sandbox and
# its own MinIO user (samples/ read, artifacts/ write in the sandbox bucket) and the artifact
# PUBLIC key only. `sandbox-detonation` (internal) is used only by the local/CI exec override.
#   docker compose --profile sandbox up -d --wait sandbox-controller

